<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>365 vì sao ✦ Thị Huyền ❤️ Hữu Phước</title>
  <link rel="icon" href="/icons/love/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/love/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta property="og:title" content="365 vì sao — Thị Huyền ❤️ Hữu Phước">
  <meta property="og:description" content="Mỗi ngày yêu nhau là một vì sao. Gom lại, thành một trái tim 💫">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://love.personal.io.vn/images/love/love-1.jpg">
  <meta property="og:url" content="https://love.personal.io.vn/365-vi-sao.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Mỗi ngày Thị Huyền và Hữu Phước bên nhau là một vì sao 💫">
  <meta name="theme-color" content="#10070f">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose:   #ff6b8a;
      --rose2:  #ff4d73;
      --pink:   #ffb3c6;
      --gold:   #f5c842;
      --gold2:  #fde68a;
      --white:  #fff;
      --mut:    rgba(255,255,255,0.55);
      --border: rgba(255,255,255,0.15);
      --glass:  rgba(26,10,20,0.55);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; overflow: hidden; }
    /* Mau nen DAC cho html: Safari iPhone lay mau nay to vung thanh trang thai
       phia tren va vung duoi day sau thanh cong cu. Chi co gradient thi Safari
       khong lay duoc mau -> tren bi mo xam, duoi lo mau trang. */
    html { background-color: #10070f; }
    body {
      background: radial-gradient(ellipse at 50% 38%, #3a1226 0%, #1a0a14 45%, #07030a 100%);
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
      user-select: none; -webkit-user-select: none;
    }

    #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* ── THANH TREN ─────────────────────────────────────── */
    .bar {
      position: fixed; z-index: 5;
      top: calc(12px + var(--safe-t)); left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .bar > * { pointer-events: auto; }
    .bar-r { display: flex; gap: 8px; }
    .pill {
      height: 40px; min-width: 40px; padding: 0 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      color: rgba(255,255,255,0.85);
      font: 500 0.82rem/1 'Inter', sans-serif;
      text-decoration: none; cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .pill:hover { background: rgba(255,77,115,0.25); border-color: rgba(255,107,138,0.5); }
    .pill.icon { width: 40px; padding: 0; font-size: 1rem; }
    .pill.on { border-color: rgba(255,107,138,0.5); }
    .pill[hidden] { display: none; }

    /* ── MAN MO DAU ─────────────────────────────────────── */
    .intro {
      position: fixed; inset: 0; z-index: 6;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center;
      background: radial-gradient(ellipse at 50% 45%, rgba(58,18,38,0.5), rgba(7,3,10,0.88));
      cursor: pointer;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }
    .intro.hide { opacity: 0; visibility: hidden; }
    .intro-line {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: clamp(1.05rem, 4.4vw, 1.5rem);
      color: rgba(255,255,255,0.88);
      max-width: 30ch; line-height: 1.5;
      opacity: 0; animation: rise 1.4s ease forwards;
    }
    .intro-line + .intro-line { animation-delay: 1.1s; }
    .start {
      margin-top: 24px; padding: 15px 34px;
      border-radius: 999px;
      border: 1px solid rgba(245,200,66,0.55);
      background: linear-gradient(135deg, rgba(245,200,66,0.22), rgba(255,77,115,0.22));
      color: var(--gold2);
      font: 600 1rem 'Inter', sans-serif; letter-spacing: 0.04em;
      cursor: pointer;
      opacity: 0;
      animation: rise 1.2s 2.2s ease forwards, ping 2.4s 3.4s ease-out infinite;
    }
    .intro-hint { font-size: 0.75rem; color: var(--mut); opacity: 0; animation: rise 1.2s 2.6s ease forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 rgba(245,200,66,0.45); }
      100% { box-shadow: 0 0 0 18px rgba(245,200,66,0); }
    }

    /* ── DONG NGAY CHAY ─────────────────────────────────── */
    .ticker {
      position: fixed; z-index: 3;
      left: 50%; bottom: calc(34px + var(--safe-b));
      transform: translateX(-50%);
      width: min(92vw, 520px);
      text-align: center;
      opacity: 0; transition: opacity 0.6s ease;
      pointer-events: none;
    }
    .ticker.show { opacity: 1; }
    .tk-date {
      font-weight: 300;
      font-size: clamp(1.9rem, 8vw, 2.8rem);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      color: var(--gold2);
      text-shadow: 0 0 24px rgba(245,200,66,0.35);
    }
    .tk-day { margin-top: 4px; font-size: 0.74rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mut); }
    .tk-ms {
      margin-top: 10px; min-height: 1.5em;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.25rem, 5vw, 1.65rem);
      color: var(--pink);
    }
    .tk-ms { transition: opacity 0.35s ease; }
    .tk-ms.off { opacity: 0; }
    .tk-ms.pop { animation: msPop 0.6s ease; }
    @keyframes msPop { from { opacity: 0; transform: translateY(8px) scale(0.96); } to { opacity: 1; transform: none; } }

    /* ── CHU KET ────────────────────────────────────────── */
    /* Khong dat transform len .finale: JS do vi tri khoi nay de chia cho trai tim */
    .finale {
      position: fixed; z-index: 3;
      left: 16px; right: 16px; bottom: calc(22px + var(--safe-b));
      text-align: center;
      opacity: 0; transition: opacity 1.2s ease;
      pointer-events: none;
    }
    .finale > * { transform: translateY(12px); transition: transform 1.2s ease; }
    .finale.show { opacity: 1; }
    .finale.show > * { transform: none; }
    .card-open .finale.show { opacity: 0.12; }
    .fn-eyebrow { font-family: 'Dancing Script', cursive; font-size: clamp(1.15rem, 4.6vw, 1.5rem); color: var(--pink); }
    .fn-num {
      font-family: 'Playfair Display', serif; font-weight: 700;
      font-size: clamp(3.2rem, 15vw, 5.6rem); line-height: 1;
      background: linear-gradient(135deg, #fff 0%, var(--gold2) 45%, var(--rose) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .fn-unit { margin-top: 4px; font-size: 0.74rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--mut); }
    .fn-line {
      margin: 12px auto 0; max-width: 34ch;
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: clamp(0.92rem, 3.6vw, 1.1rem); line-height: 1.5;
      color: rgba(255,255,255,0.88);
    }
    .fn-names { margin-top: 10px; font-size: 0.9rem; letter-spacing: 0.04em; }
    .fn-names span { color: var(--rose2); }
    .fn-dates { margin-top: 3px; font-size: 0.72rem; color: var(--mut); font-variant-numeric: tabular-nums; }
    .fn-hint { margin-top: 12px; font-size: 0.74rem; color: var(--gold2); animation: blink 2.6s ease-in-out infinite; }
    .fn-letter {
      margin-top: 14px; padding: 12px 24px;
      border-radius: 999px;
      border: 1px solid rgba(245,200,66,0.55);
      background: linear-gradient(135deg, rgba(245,200,66,0.22), rgba(255,77,115,0.25));
      color: var(--gold2);
      font: 600 0.92rem 'Inter', sans-serif;
      cursor: pointer;
      animation: ping 2.4s ease-out infinite;
    }
    .fn-letter[hidden] { display: none; }
    .fn-letter:hover { background: linear-gradient(135deg, rgba(245,200,66,0.32), rgba(255,77,115,0.38)); }
    /* Khoi chu ket khong nhan cham; rieng nut thu thi nhan — nhung chi khi da hien */
    .finale.show .fn-letter { pointer-events: auto; }

    /* ── LA THU ─────────────────────────────────────────── */
    .letter {
      position: fixed; inset: 0; z-index: 7;
      display: flex; align-items: center; justify-content: center;
      padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
      background: rgba(7,3,10,0.82);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      opacity: 0; visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s;
    }
    .letter.show { opacity: 1; visibility: visible; }
    .lt-paper {
      width: 100%; max-width: 560px; max-height: 100%;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 30px 26px 22px;
      border-radius: 22px;
      border: 1px solid rgba(245,200,66,0.35);
      background: linear-gradient(160deg, #2d1525, #150810);
      box-shadow: 0 24px 70px rgba(0,0,0,0.6);
      transform: translateY(24px) scale(0.97);
      transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
      user-select: text; -webkit-user-select: text;
    }
    .letter.show .lt-paper { transform: none; }
    .lt-icon { font-size: 2.2rem; line-height: 1; text-align: center; }
    .lt-title { margin-top: 10px; font-family: 'Playfair Display', serif; font-size: 1.35rem; color: var(--gold2); text-align: center; }
    .lt-meta { margin: 4px 0 22px; font-size: 0.74rem; color: var(--mut); text-align: center; }
    /* Tung doan hien dan nhu dang mo thu doc */
    .lt-text p {
      margin-bottom: 14px;
      white-space: pre-wrap;
      font-size: 0.98rem; line-height: 1.85;
      color: rgba(255,255,255,0.92);
      animation: rise 0.9s ease both;
    }
    .lt-done {
      margin-top: 10px; width: 100%; padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border); background: none;
      color: var(--mut);
      font: 500 0.86rem 'Inter', sans-serif;
      cursor: pointer;
    }
    .lt-done:hover { color: var(--white); border-color: var(--rose); }
    @keyframes blink { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

    /* ── THE NGAY (cham vao sao) ────────────────────────── */
    .day-card {
      position: fixed; z-index: 4;
      left: 12px; right: 12px; bottom: calc(12px + var(--safe-b));
      max-width: 440px; margin: 0 auto;
      display: flex; gap: 14px; align-items: center;
      padding: 14px 40px 14px 14px;
      border-radius: 20px;
      border: 1px solid rgba(245,200,66,0.35);
      background: rgba(26,10,20,0.9);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 18px 50px rgba(0,0,0,0.55);
      opacity: 0; visibility: hidden; transform: translateY(16px);
      transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s;
    }
    .day-card.show { opacity: 1; visibility: visible; transform: none; }
    .dc-photo {
      width: 104px; height: 104px; flex: none;
      object-fit: cover; border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
    }
    .dc-photo[hidden] { display: none; }
    .dc-body { flex: 1; min-width: 0; }
    .dc-top { display: flex; align-items: center; gap: 8px; }
    .dc-icon { font-size: 1.3rem; line-height: 1; }
    .dc-n { font-weight: 600; font-size: 0.95rem; color: var(--gold2); }
    .dc-date { margin-top: 3px; font-size: 0.76rem; color: var(--mut); }
    .dc-ms { margin-top: 8px; font-size: 0.9rem; line-height: 1.45; white-space: pre-line; }
    .dc-line {
      margin-top: 8px;
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 0.88rem; line-height: 1.5;
      color: rgba(255,255,255,0.85);
    }
    .dc-ms[hidden], .dc-line[hidden] { display: none; }
    .dc-x {
      position: absolute; top: 6px; right: 6px;
      width: 32px; height: 32px;
      border: none; background: none;
      color: var(--mut); font-size: 1.4rem; line-height: 1;
      cursor: pointer;
    }
    .dc-x:hover { color: var(--white); }

    /* ── MAN NGANG / MAY TINH: tim ben trai, chu ben phai ─ */
    /* Cung dieu kien voi mqWide trong JS */
    @media (min-aspect-ratio: 5/4) {
      .finale {
        left: auto; right: max(5vw, 20px); bottom: auto; top: 50%;
        width: min(40vw, 420px);
        transform: translateY(-50%);
        text-align: left;
      }
      .fn-line { margin-left: 0; }
      .day-card {
        left: auto; right: max(5vw, 20px); bottom: auto; top: 50%;
        width: min(40vw, 420px); max-width: none; margin: 0;
        flex-direction: column; align-items: stretch;
        padding: 16px;
        transform: translateY(calc(-50% + 16px));
      }
      .day-card.show { transform: translateY(-50%); }
      .dc-photo { width: 100%; height: auto; aspect-ratio: 4 / 3; }
    }

    /* Dien thoai xoay ngang — man thap */
    @media (max-height: 500px) {
      .fn-num { font-size: 2.8rem; }
      .fn-line { margin-top: 6px; font-size: 0.82rem; }
      .fn-names { margin-top: 6px; }
      .fn-hint { margin-top: 6px; }
      .ticker { bottom: calc(14px + var(--safe-b)); }
      .tk-date { font-size: 1.6rem; }
      .tk-ms { margin-top: 4px; }
      .intro-line { font-size: 1rem; }
      .start { margin-top: 10px; }
      .day-card .dc-photo { max-height: 42vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro-line, .start, .intro-hint, .lt-text p { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>

<canvas id="sky"></canvas>

<header class="bar" id="bar">
  <a class="pill" href="love.html">‹ Trang tình yêu</a>
  <div class="bar-r">
    <button class="pill" id="skip" hidden>Bỏ qua ›</button>
    <button class="pill icon" id="replay" aria-label="Xem lại từ đầu" title="Xem lại" hidden>↻</button>
    <button class="pill icon" id="music" aria-label="Bật/tắt nhạc" title="Bật/tắt nhạc">🎵</button>
  </div>
</header>

<section class="intro" id="intro">
  <p class="intro-line" id="introLine"></p>
  <p class="intro-line">có hai người cùng thắp lên ngôi sao đầu tiên.</p>
  <button class="start" id="start">Chạm để bắt đầu ✦</button>
  <p class="intro-hint">🎧 Mở âm thanh lên để trọn vẹn nhé</p>
</section>

<div class="ticker" id="ticker">
  <div class="tk-date" id="tkDate"></div>
  <div class="tk-day" id="tkDay"></div>
  <div class="tk-ms" id="tkMs"></div>
</div>

<section class="finale" id="finale">
  <div class="fn-eyebrow" id="fnEyebrow"></div>
  <div class="fn-num" id="fnNum"></div>
  <div class="fn-unit">ngày bên nhau</div>
  <p class="fn-line">Mỗi ngày là một vì sao — gom lại, thành trái tim của anh.</p>
  <div class="fn-names">Thị Huyền <span>❤</span> Hữu Phước</div>
  <div class="fn-dates" id="fnDates"></div>
  <div class="fn-hint">Chạm vào một ngôi sao để xem ngày đó ✦</div>
  <button class="fn-letter" id="fnLetter" hidden>Đọc thư anh gửi 💌</button>
</section>

<!-- THU CUA HOM NAY -->
<div class="letter" id="letter" role="dialog" aria-modal="true" aria-labelledby="ltTitle">
  <div class="lt-paper" id="ltPaper">
    <div class="lt-icon" id="ltIcon">💌</div>
    <h2 class="lt-title" id="ltTitle"></h2>
    <div class="lt-meta" id="ltMeta"></div>
    <div class="lt-text" id="ltText"></div>
    <button class="lt-done" id="ltDone">Gấp thư lại 💕</button>
  </div>
</div>

<div class="day-card" id="card" role="dialog" aria-live="polite">
  <button class="dc-x" id="cardX" aria-label="Đóng">×</button>
  <img class="dc-photo" id="dcPhoto" alt="Khoảnh khắc của chúng mình" hidden>
  <div class="dc-body">
    <div class="dc-top"><span class="dc-icon" id="dcIcon"></span><span class="dc-n" id="dcN"></span></div>
    <div class="dc-date" id="dcDate"></div>
    <div class="dc-ms" id="dcMs" hidden></div>
    <p class="dc-line" id="dcLine" hidden></p>
  </div>
</div>

<script src="js/milestones.js"></script>
<script src="js/letters.js"></script>
<script>
(() => {
  'use strict';
  const { START, DAY, fmtVN, dayKey } = Milestones;

  // ★ Gan anh that cho tung moc: 'YYYY-MM-DD': 'ten file trong images/love/'.
  //   Anh trong thu vien khong con ngay chup nen khong tu ghep duoc — moc nao
  //   khong khai bao o day se tu lay mot tam trong thu vien.
  const MILESTONE_PHOTOS = {
    // '2025-10-18': 'love-1.jpg',
  };
  // Bai dau phat ngay khi bat dau; het bai thi sang bai ke, het danh sach thi quay lai bai dau
  const PLAYLIST = [
    'music/love/giai-cuu-the-gioi.mp3',
    'music/love/yeu-em-hon-moi-ngay.mp3',
    'music/love/you-are-my-crush.mp3',
  ];

  const DAY_MS = 22;             // ngay thuong luot qua nhanh...
  const DAYS_MAX_MS = 8000;      // ...nhung ca doan ngay thuong khong qua 8 giay, du sau nay nhieu nam
  const EVENT_MS = 2000;         // moi moc dung lai 2 giay cho kip doc ten
  const HOLD_MS = 1300;          // dung lai mot nhip truoc khi gom
  const GATHER_MS = 2200;        // moi ngoi sao bay ve tim
  const GATHER_STAGGER = 1500;   // sao sau xuat phat tre hon sao truoc

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mqWide = matchMedia('(min-aspect-ratio: 5/4)');   // cung dieu kien voi CSS
  const WEEKDAYS = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
  const DAY_LINES = [
    'Một ngày bình thường — nhưng có em nên chẳng bình thường chút nào.',
    'Thêm một ngày được nghe em kể chuyện.',
    'Ngôi sao nhỏ thôi, nhưng sáng vì có em.',
    'Một ngày nữa anh chọn em, và sẽ còn chọn mãi.',
    'Hôm ấy có thể chẳng có gì đặc biệt, ngoài việc anh vẫn thương em.',
    'Ngày này cũng được tính là một ngày hạnh phúc.',
    'Có em, ngày nào cũng đáng để nhớ.',
  ];
  const $ = (id) => document.getElementById(id);

  // ── NGAY DANG XEM ──────────────────────────────────────────
  // Them ?ngay=2026-10-18 vao dia chi de xem truoc dung ngay ky niem.
  const TODAY = (() => {
    const m = (new URLSearchParams(location.search).get('ngay') || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    const d = m ? new Date(+m[1], m[2] - 1, +m[3]) : new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  })();
  const S0 = new Date(START);
  const N = Math.max(0, Math.round((TODAY - S0) / DAY));       // so ngay ben nhau
  const YEARS = TODAY.getFullYear() - S0.getFullYear();
  const IS_ANNIV = N > 0 && TODAY.getMonth() === S0.getMonth() && TODAY.getDate() === S0.getDate();

  // ── HINH TRAI TIM (toa do tham so, truc y huong len) ─────────
  const CURVE = [];
  for (let j = 0; j < 720; j++) {
    const t = (j / 720) * Math.PI * 2;
    CURVE.push([
      16 * Math.sin(t) ** 3,
      13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t),
    ]);
  }
  const Y_MIN = Math.min(...CURVE.map((p) => p[1]));
  const Y_MAX = Math.max(...CURVE.map((p) => p[1]));
  const Y_MID = (Y_MIN + Y_MAX) / 2;
  const HEART_W = 32, HEART_H = Y_MAX - Y_MIN;

  /** Trong tim chua (dem so lan tia cat bien) */
  function inHeart(x, y) {
    let inside = false;
    for (let a = 0, b = CURVE.length - 1; a < CURVE.length; b = a++) {
      const [xa, ya] = CURVE[a], [xb, yb] = CURVE[b];
      if ((ya > y) !== (yb > y) && x < ((xb - xa) * (y - ya)) / (yb - ya) + xa) inside = !inside;
    }
    return inside;
  }

  /** Trong tam hinh tim — cho ngoi sao "hom nay" */
  const CENTER = (() => {
    let A = 0, cx = 0, cy = 0;
    for (let a = 0, b = CURVE.length - 1; a < CURVE.length; b = a++) {
      const [x0, y0] = CURVE[b], [x1, y1] = CURVE[a];
      const c = x0 * y1 - x1 * y0;
      A += c; cx += (x0 + x1) * c; cy += (y0 + y1) * c;
    }
    return [cx / (3 * A), cy / (3 * A)];
  })();

  /**
   * Rai n diem len trai tim: vien truoc (bat dau tu khe giua hai thuy, di
   * vong theo chieu kim dong ho), roi lap day ruot tu ngoai vao trong, diem
   * cuoi cung dung giua tim. Sao thu i bay ve diem thu i.
   */
  function heartPoints(n) {
    if (n <= 1) return [CENTER];
    const rimCount = n < 24 ? n - 1 : Math.min(180, Math.round(n * 0.42));

    const len = [0];
    for (let j = 1; j <= CURVE.length; j++) {
      const [x0, y0] = CURVE[j - 1], [x1, y1] = CURVE[j % CURVE.length];
      len.push(len[j - 1] + Math.hypot(x1 - x0, y1 - y0));
    }
    const total = len[len.length - 1];
    const rim = [];
    for (let k = 0, j = 0; k < rimCount; k++) {
      const target = (k / rimCount) * total;
      while (len[j + 1] < target) j++;
      const f = (target - len[j]) / (len[j + 1] - len[j] || 1);
      const [x0, y0] = CURVE[j], [x1, y1] = CURVE[(j + 1) % CURVE.length];
      rim.push([x0 + (x1 - x0) * f, y0 + (y1 - y0) * f]);
    }

    // "Best candidate": moi diem chon trong vai ung vien cai xa cac diem cu nhat
    // -> rai deu, khong cho dac cho thua. Nhieu sao thi bot ung vien cho nhanh.
    const tries = Math.max(3, Math.round(14 * Math.min(1, 600 / n)));
    const taken = rim.concat([CENTER]);
    const fill = [];
    for (let k = 0; k < n - rimCount - 1; k++) {
      let best = null, bestD = -1;
      for (let c = 0; c < tries; c++) {
        let x, y;
        do { x = (Math.random() * 2 - 1) * 16; y = Y_MIN + Math.random() * HEART_H; } while (!inHeart(x, y));
        let d = Infinity;
        for (const p of taken) {
          const dd = (p[0] - x) ** 2 + (p[1] - y) ** 2;
          if (dd < d) d = dd;
        }
        if (d > bestD) { bestD = d; best = [x, y]; }
      }
      fill.push(best); taken.push(best);
    }
    const far = (p) => Math.hypot(p[0] - CENTER[0], p[1] - CENTER[1]);
    fill.sort((a, b) => far(b) - far(a));
    return rim.concat(fill, [CENTER]);
  }

  /** Vi tri rai rac tren bau troi luc moi thap sang (toa do 0..1) */
  function skyPoints(n, aspect) {
    const tries = Math.max(3, Math.round(8 * Math.min(1, 600 / n)));
    const out = [];
    for (let k = 0; k < n; k++) {
      let best = null, bestD = -1;
      for (let c = 0; c < tries; c++) {
        const u = 0.05 + Math.random() * 0.9, v = 0.1 + Math.random() * 0.66;
        let d = Infinity;
        for (const p of out) {
          const dd = ((p[0] - u) * aspect) ** 2 + (p[1] - v) ** 2;
          if (dd < d) d = dd;
        }
        if (d > bestD) { bestD = d; best = [u, v]; }
      }
      out.push(best);
    }
    return out;
  }

  // ── MOI NGAY MOT VI SAO ───────────────────────────────────────
  // Trang nay loc bot moc thang cho do dai: chi lay 1, 2, 3 roi cu 3 thang mot
  // lan (6, 9, 15, 18...). Tron 12, 24... da co moc "Ky niem N nam" nen bo qua.
  // Moc ca nhan, 100 ngay, tron nam giu het. Trang love van hien du cac thang.
  const SHOW_MONTH = (n) => n % 12 !== 0 && (n <= 3 || n % 3 === 0);
  const msByKey = {};
  const addMs = (m) => {
    if (m.ts <= TODAY.getTime()) (msByKey[m.key] = msByKey[m.key] || []).push(m);
  };
  Milestones.build().filter((m) => m.type !== 'month').forEach(addMs);
  for (let n = 1; ; n++) {
    const dt = Milestones.addMonths(S0, n);
    if (dt > TODAY) break;
    if (SHOW_MONTH(n)) addMs({ type: 'month', icon: '🌷', name: `Tròn ${n} tháng bên nhau`, ts: dt.getTime(), key: dayKey(dt) });
  }

  const heart = heartPoints(N + 1);
  const sky = skyPoints(N + 1, innerWidth / innerHeight);
  const stars = [];
  let specialCount = 0;
  for (let i = 0; i <= N; i++) {
    const dt = new Date(S0.getFullYear(), S0.getMonth(), S0.getDate() + i);
    const key = dayKey(dt);
    const ms = msByKey[key] || null;
    const kind = i === N ? 'today' : ms || i === 0 ? 'ms' : 'day';
    stars.push({
      i, dt, key, ms, kind,
      col: kind === 'today' ? 'rose' : kind === 'ms' ? 'gold' : Math.random() < 0.75 ? 'white' : 'pink',
      r: kind === 'today' ? 3.4 : kind === 'ms' ? 2.6 : 1 + Math.random(),
      hx: heart[i][0], hy: heart[i][1],
      u: sky[i][0], v: sky[i][1],
      ph: Math.random() * Math.PI * 2,
      sp: 0.6 + Math.random() * 1.6,
      swirl: (Math.random() - 0.5) * 0.5,
      delay: (i / Math.max(1, N)) * GATHER_STAGGER + Math.random() * 220,
      specialIdx: kind === 'day' ? -1 : specialCount++,
      lightAt: 0, x: -999, y: -999,
    });
  }

  // Moc dung lai EVENT_MS de kip doc ten, ngay thuong luot nhanh
  const dayMs = Math.min(DAY_MS, DAYS_MAX_MS / Math.max(1, stars.filter((s) => s.kind === 'day').length));
  let lightTotal = 0;            // tong thoi gian thap sang het cac ngay
  stars.forEach((s) => { s.lightAt = lightTotal; lightTotal += s.kind === 'day' ? dayMs : EVENT_MS; });

  // ── CHU TREN TRANG ───────────────────────────────────────────
  $('introLine').textContent = (IS_ANNIV
    ? (YEARS === 1 ? 'Một năm trước' : `${YEARS} năm trước`)
    : `${N} ngày trước`) + ', ở một góc nhỏ của vũ trụ…';
  $('fnEyebrow').textContent = IS_ANNIV ? `Chúc mừng kỷ niệm ${YEARS} năm 🎉` : 'Tính đến hôm nay';
  $('fnNum').textContent = N.toLocaleString('vi-VN');
  $('fnDates').textContent = `${fmtVN(S0)} — ${fmtVN(TODAY)}`;

  // ── CANVAS ───────────────────────────────────────────────────
  const cv = $('sky');
  const ctx = cv.getContext('2d');
  const finaleEl = $('finale');
  let W = 0, H = 0, K = 10, CX = 0, CY = 0;
  let SZ = 1;                    // co sao theo co trai tim — man to thi sao to theo

  function makeGlow(rgb) {
    const s = 64, c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.18, `rgba(${rgb},0.9)`);
    grd.addColorStop(0.42, `rgba(${rgb},0.22)`);
    grd.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = grd;
    g.fillRect(0, 0, s, s);
    return c;
  }
  /** Tia chu thap cho sao moc */
  function makeFlare(rgb) {
    const s = 128, m = s / 2, c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    [[0, m, s, m], [m, 0, m, s]].forEach(([x0, y0, x1, y1]) => {
      const lg = g.createLinearGradient(x0, y0, x1, y1);
      lg.addColorStop(0, `rgba(${rgb},0)`);
      lg.addColorStop(0.5, `rgba(${rgb},0.9)`);
      lg.addColorStop(1, `rgba(${rgb},0)`);
      g.strokeStyle = lg; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    });
    return c;
  }
  const GLOW = {
    white: makeGlow('255,244,236'), pink: makeGlow('255,179,198'),
    gold: makeGlow('245,200,66'), rose: makeGlow('255,77,115'),
  };
  const FLARE = { gold: makeFlare('253,230,138'), rose: makeFlare('255,179,198') };

  /** Chia man hinh: phan con lai sau thanh tren va khoi chu ket la cho cua trai tim */
  function layout() {
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const top = $('bar').getBoundingClientRect().bottom + 10;
    const fin = finaleEl.getBoundingClientRect();
    let x0, x1, y0, y1;
    if (mqWide.matches) { x0 = 16; x1 = fin.left - 28; y0 = top; y1 = H - 16; }
    else { x0 = 14; x1 = W - 14; y0 = top; y1 = fin.top - 16; }
    K = Math.max(4, Math.min(22, ((x1 - x0) * 0.92) / HEART_W, ((y1 - y0) * 0.95) / HEART_H));
    CX = (x0 + x1) / 2; CY = (y0 + y1) / 2;
    SZ = Math.min(1.6, Math.max(0.8, Math.sqrt(K / 11)));
    makeDust();
  }

  const heartX = (x, sc) => CX + x * K * sc;
  const heartY = (y, sc) => CY - (y - Y_MID) * K * sc;

  // Bui sao nen — khong phai ngay nao ca, chi cho bau troi day dan
  let dust = [];
  function makeDust() {
    const n = Math.round(Math.min(220, (W * H) / 6500));
    dust = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 0.9 + 0.2, a: Math.random() * 0.4 + 0.1,
      ph: Math.random() * 6.283, sp: Math.random() * 0.8 + 0.2,
    }));
  }
  function drawDust(t) {
    ctx.fillStyle = '#fff';
    for (const d of dust) {
      ctx.globalAlpha = d.a * (0.6 + 0.4 * Math.sin(t * 0.001 * d.sp + d.ph));
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Sao bang thinh thoang vut qua
  const shoots = [];
  let nextShoot = 2500;
  function drawShoots(t) {
    if (reduceMotion) return;
    if (t > nextShoot) {
      nextShoot = t + 3500 + Math.random() * 6000;
      const ang = Math.PI * (0.76 + Math.random() * 0.12);
      shoots.push({ x: W * (0.35 + Math.random() * 0.65), y: H * Math.random() * 0.35, ang, sp: 0.9 + Math.random() * 0.6, born: t });
    }
    for (let k = shoots.length - 1; k >= 0; k--) {
      const s = shoots[k], age = t - s.born;
      if (age > 900) { shoots.splice(k, 1); continue; }
      const cx = Math.cos(s.ang), cy = Math.sin(s.ang);
      const hx = s.x + cx * s.sp * age, hy = s.y + cy * s.sp * age;
      const lg = ctx.createLinearGradient(hx - cx * 110, hy - cy * 110, hx, hy);
      lg.addColorStop(0, 'rgba(255,255,255,0)');
      lg.addColorStop(1, 'rgba(255,240,245,0.9)');
      ctx.globalAlpha = Math.sin((Math.PI * age) / 900);
      ctx.strokeStyle = lg; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(hx - cx * 110, hy - cy * 110); ctx.lineTo(hx, hy); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const easeInOut = (e) => (e < 0.5 ? 4 * e * e * e : 1 - (-2 * e + 2) ** 3 / 2);
  const backOut = (e) => 1 + 2.7 * (e - 1) ** 3 + 1.7 * (e - 1) ** 2;
  /** Nhip tim "thinh-thinh" chu ky 1.6 giay */
  function beat(t) {
    const x = (t % 1600) / 1600;
    const b = (c) => Math.exp(-((x - c) ** 2) / 0.0018);
    return b(0) + b(1) + 0.6 * b(0.18);
  }

  // ── TRANG THAI ───────────────────────────────────────────────
  let phase = 'intro';            // intro -> light -> gather -> heart
  let tLight = 0, tGather = 0, tHeart = 0;
  let hovered = null, selected = null;

  function drawStars(t) {
    const lt = t - tLight;
    const b = phase === 'heart' && !reduceMotion ? beat(t) : 0;
    const sc = 1 + 0.03 * b;
    ctx.globalCompositeOperation = 'lighter';

    // Quang hong phia sau trai tim
    if (phase !== 'light') {
      const g = phase === 'heart' ? clamp01((t - tHeart) / 1500) : 0.6 * clamp01((t - tGather) / (GATHER_MS + GATHER_STAGGER));
      const gx = heartX(CENTER[0], 1), gy = heartY(CENTER[1], 1), R = K * 19;
      const grd = ctx.createRadialGradient(gx, gy, 0, gx, gy, R);
      grd.addColorStop(0, `rgba(255,77,115,${(0.15 + 0.07 * b) * g})`);
      grd.addColorStop(1, 'rgba(255,77,115,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(gx - R, gy - R, 2 * R, 2 * R);
    }

    for (const s of stars) {
      let x, y, a = 1, z = 1;
      if (phase === 'light') {
        const age = lt - s.lightAt;
        if (age < 0) { s.x = s.y = -999; continue; }
        const e = clamp01(age / 600);
        a = e; z = e < 1 ? backOut(e) : 1;
        x = s.u * W; y = s.v * H;
        if (s.kind !== 'day' && age < 1100) {          // vong sang loe ra khi toi moc
          const p = age / 1100;
          ctx.globalAlpha = (1 - p) * 0.7;
          ctx.strokeStyle = s.kind === 'today' ? '#ff6b8a' : '#f5c842';
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(x, y, s.r * 2 + p * 34, 0, 6.283); ctx.stroke();
        }
      } else if (phase === 'gather') {
        const e = easeInOut(clamp01((t - tGather - s.delay) / GATHER_MS));
        const sx = s.u * W, sy = s.v * H;
        const dx = heartX(s.hx, 1) - sx, dy = heartY(s.hy, 1) - sy;
        const arc = Math.sin(Math.PI * e) * s.swirl;   // bay vong cung, khong bay thang
        x = sx + dx * e - dy * arc; y = sy + dy * e + dx * arc;
      } else {
        x = heartX(s.hx, sc); y = heartY(s.hy, sc);
      }

      const tw = s.kind === 'day' ? 0.7 + 0.3 * Math.sin(t * 0.001 * s.sp + s.ph) : 1;
      const size = s.r * 7 * SZ * z * (s.kind === 'today' ? 1 + 0.15 * Math.sin(t * 0.004) : 1);
      ctx.globalAlpha = a * tw;
      ctx.drawImage(GLOW[s.col], x - size / 2, y - size / 2, size, size);
      if (s.kind !== 'day') {
        const fs = s.r * 11 * SZ * z * (0.85 + 0.15 * Math.sin(t * 0.003 + s.ph));
        ctx.save();
        ctx.translate(x, y); ctx.rotate(t * 0.0003 + s.ph);
        ctx.drawImage(FLARE[s.kind === 'today' ? 'rose' : 'gold'], -fs / 2, -fs / 2, fs, fs);
        ctx.restore();
      }
      s.x = x; s.y = y;
    }

    if (phase === 'heart') {
      for (const s of [hovered, selected]) {
        if (!s) continue;
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(s.x, s.y, (9 + 2 * Math.sin(t * 0.006)) * SZ, 0, 6.283); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ── DONG NGAY CHAY ───────────────────────────────────────────
  const tickerEl = $('ticker'), tkDate = $('tkDate'), tkDay = $('tkDay'), tkMs = $('tkMs');
  let tickIdx = -1;
  const dayLabel = (s) => (s.i === 0 ? 'Ngày đầu tiên' : `Ngày thứ ${s.i}`);
  const msLabel = (s) => (s.ms ? s.ms.map((m) => `${m.icon} ${m.name}`).join(' · ') : '💗 Hôm nay');

  function updateTicker(lt) {
    let i = tickIdx;
    while (i + 1 < stars.length && stars[i + 1].lightAt <= lt) i++;
    if (i === tickIdx) return;
    tickIdx = i;
    const s = stars[i];
    tkDate.textContent = fmtVN(s.dt);
    tkDay.textContent = dayLabel(s);
    // Ten moc chi hien trong luc ngay dung o moc do, ngay chay tiep thi mo di
    // -> ngay va ten moc luon khop nhau
    if (s.kind !== 'day') {
      tkMs.textContent = msLabel(s);
      tkMs.classList.remove('off', 'pop'); void tkMs.offsetWidth; tkMs.classList.add('pop');
    } else {
      tkMs.classList.add('off');
    }
  }

  // ── CHUYEN CANH ──────────────────────────────────────────────
  const skipEl = $('skip'), replayEl = $('replay');

  function startLight(t) {
    phase = 'light'; tLight = t; tickIdx = -1;
    tkDate.textContent = tkDay.textContent = tkMs.textContent = '';
    tickerEl.classList.add('show');
    finaleEl.classList.remove('show');
    closeCard();
    skipEl.hidden = false; replayEl.hidden = true;
  }
  function startGather(t) {
    phase = 'gather'; tGather = t;
    tickerEl.classList.remove('show');
  }
  function goHeart(t) {
    phase = 'heart'; tHeart = t;
    tickerEl.classList.remove('show');
    finaleEl.classList.add('show');
    skipEl.hidden = true; replayEl.hidden = false;
  }

  function frame(t) {
    if (phase === 'light') {
      updateTicker(t - tLight);
      if (t - tLight > lightTotal + HOLD_MS) startGather(t);
    } else if (phase === 'gather' && t - tGather > GATHER_MS + GATHER_STAGGER + 250) {
      goHeart(t);
    }
    ctx.clearRect(0, 0, W, H);
    drawDust(t);
    drawShoots(t);
    if (phase !== 'intro') drawStars(t);
    requestAnimationFrame(frame);
  }

  // ── NHAC ─────────────────────────────────────────────────────
  const musicEl = $('music');
  let track = 0;
  const audio = new Audio(PLAYLIST[0]);
  audio.preload = 'auto';
  let musicOn = false;

  // Doi bai tren CUNG mot phan tu audio: iPhone chi cho phat tiep khong can
  // cham neu van la phan tu da duoc mo khoa bang lan cham "bat dau"
  audio.addEventListener('ended', () => {
    track = (track + 1) % PLAYLIST.length;
    audio.src = PLAYLIST[track];
    if (musicOn) audio.play().catch(() => {});
  });

  function setMusic(on) {
    musicOn = on;
    musicEl.textContent = on ? '🔊' : '🎵';
    musicEl.classList.toggle('on', on);
    if (!on) { audio.pause(); return; }
    audio.volume = 0;
    audio.play().catch(() => setMusic(false));
    const t0 = performance.now();
    const fade = (t) => {                      // len tieng tu tu trong 2.5 giay
      const p = clamp01((t - t0) / 2500);
      audio.volume = 0.55 * p;
      if (p < 1 && musicOn) requestAnimationFrame(fade);
    };
    requestAnimationFrame(fade);
  }
  musicEl.addEventListener('click', () => setMusic(!musicOn));

  // ── GIU MAN HINH SANG ────────────────────────────────────────
  // Dien thoai tu khoa sau ~30 giay khong cham, ma phan thap sao dai hon the.
  // Trinh duyet tu nha khoa khi an trang nen quay lai thi phai xin lai.
  let wakeLock = null;
  async function keepAwake() {
    if (document.hidden || (wakeLock && !wakeLock.released)) return;
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (musicOn) audio.pause(); return; }
    if (musicOn) audio.play().catch(() => {});
    if (phase !== 'intro') keepAwake();
  });

  // ── THE NGAY ─────────────────────────────────────────────────
  const cardEl = $('card'), dcPhoto = $('dcPhoto'), dcMs = $('dcMs'), dcLine = $('dcLine');
  let photos = [];
  fetch('images/love/images.json')
    .then((r) => (r.ok ? r.json() : []))
    .then((list) => { photos = list.filter((m) => m.t === 'img'); })
    .catch(() => {});

  function photoFor(s) {
    if (MILESTONE_PHOTOS[s.key]) return 'images/love/' + MILESTONE_PHOTOS[s.key];
    if (!photos.length) return null;
    const m = photos[(s.specialIdx * 7) % photos.length];   // moi moc mot tam khac nhau
    return 'images/love/' + (m.thumb ? 'thumbs/' + m.thumb : m.f);
  }

  function openCard(s) {
    selected = s;
    $('dcIcon').textContent = s.ms ? s.ms[0].icon : s.kind === 'today' ? '💗' : '✦';
    $('dcN').textContent = s.kind === 'today' && s.i > 0 ? `Hôm nay · ngày thứ ${s.i}` : dayLabel(s);
    $('dcDate').textContent = `${WEEKDAYS[s.dt.getDay()]}, ${fmtVN(s.dt)}`;
    dcMs.textContent = s.ms ? s.ms.map((m) => m.name).join('\n') : '';
    dcMs.hidden = !s.ms;
    dcLine.textContent = s.kind === 'today' ? 'Hôm nay — và mãi mãi về sau. 💕'
      : s.ms ? '' : DAY_LINES[s.i % DAY_LINES.length];
    dcLine.hidden = !dcLine.textContent;
    const src = s.kind !== 'day' ? photoFor(s) : null;
    if (src) { dcPhoto.src = src; dcPhoto.hidden = false; }
    else { dcPhoto.hidden = true; dcPhoto.removeAttribute('src'); }
    cardEl.classList.add('show');
    document.body.classList.add('card-open');
  }
  function closeCard() {
    selected = null;
    cardEl.classList.remove('show');
    document.body.classList.remove('card-open');
  }

  /** Ngoi sao gan diem cham nhat (sao rat nho nen phai noi rong vung cham) */
  function nearest(x, y, maxD) {
    let best = null, bd = maxD * maxD;
    for (const s of stars) {
      const d = (s.x - x) ** 2 + (s.y - y) ** 2;
      if (d < bd) { bd = d; best = s; }
    }
    return best;
  }

  cv.addEventListener('click', (e) => {
    if (phase !== 'heart') return;
    const s = nearest(e.clientX, e.clientY, 28);
    if (s) openCard(s); else closeCard();
  });
  cv.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || phase !== 'heart') return;
    hovered = nearest(e.clientX, e.clientY, 16);
    cv.style.cursor = hovered ? 'pointer' : 'default';
  });
  $('cardX').addEventListener('click', closeCard);

  // ── THU CUA HOM NAY ──────────────────────────────────────────
  // Ngay nao co thu mo (18/10 la thu "ngay tron 1 nam") thi man ket co nut doc
  // thu ngay. Thu nam trong data/letters.json — them/sua bang `npm run letter`.
  const letterEl = $('letter'), letterBtn = $('fnLetter');
  let todayLetter = null;
  fetch('data/letters.json')
    .then((r) => (r.ok ? r.json() : []))
    .then((list) => {
      todayLetter = (Array.isArray(list) ? list : []).find((l) => l.openAt === dayKey(TODAY)) || null;
      if (!todayLetter) return;
      letterBtn.hidden = false;
      layout();                                  // khoi chu ket cao them -> chia lai cho cho trai tim
    })
    .catch(() => {});

  function openLetter() {
    if (!todayLetter) return;
    const text = Letters.decode(todayLetter.body, todayLetter.openAt);
    $('ltIcon').textContent = todayLetter.icon || '💌';
    $('ltTitle').textContent = todayLetter.title;
    $('ltMeta').textContent = `Mở ngày ${fmtVN(TODAY)}`;
    const box = $('ltText');
    box.textContent = '';
    text.split(/\n\s*\n/).forEach((para, i) => {
      const p = document.createElement('p');
      p.textContent = para.trim();
      p.style.animationDelay = `${0.3 + Math.min(i, 12) * 0.45}s`;
      box.appendChild(p);
    });
    closeCard();
    $('ltPaper').scrollTop = 0;
    letterEl.classList.add('show');
  }
  function closeLetter() { letterEl.classList.remove('show'); }

  letterBtn.addEventListener('click', openLetter);
  $('ltDone').addEventListener('click', closeLetter);
  letterEl.addEventListener('click', (e) => { if (e.target === letterEl) closeLetter(); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (letterEl.classList.contains('show')) closeLetter(); else closeCard();
  });

  // ── BAT DAU ──────────────────────────────────────────────────
  const introEl = $('intro');
  function begin() {
    if (phase !== 'intro') return;
    introEl.classList.add('hide');
    setMusic(true);                            // nhac phai bat tu mot lan cham that
    keepAwake();
    const t = performance.now();
    if (reduceMotion) goHeart(t); else startLight(t);
  }
  introEl.addEventListener('click', begin);
  skipEl.addEventListener('click', () => {
    const t = performance.now();
    if (phase === 'light') startGather(t);
    else if (phase === 'gather') goHeart(t);
  });
  replayEl.addEventListener('click', () => startLight(performance.now()));

  let resizeRaf = 0;
  addEventListener('resize', () => {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(layout);
  });
  layout();
  if (document.fonts) document.fonts.ready.then(layout);   // font ve xong thi khoi chu ket doi chieu cao
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
