<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>World Cup 2026 — Lịch thi đấu & BXH</title>
<meta name="description" content="Lịch thi đấu và bảng xếp hạng FIFA World Cup 2026 — cập nhật real-time" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/worldcup/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/icons/worldcup/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/worldcup/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/worldcup/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/worldcup/apple-touch-icon.png">
<link rel="manifest" href="/manifest-worldcup.json">
<meta name="theme-color" content="#f59e0b" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="World Cup 2026">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0e1a;
    --bg-card: #131826;
    --bg-soft: #1a2030;
    --border: #1f2937;
    --accent: #06b6d4;
    --accent-2: #f59e0b;
    --good: #10b981;
    --bad: #ef4444;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-fade: #64748b;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    padding-top: max(32px, env(safe-area-inset-top));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
    margin-bottom: 6px;
  }
  header h1 .trophy { font-size: 30px; margin-right: 6px; }
  header .sub {
    color: var(--text-dim);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  header .sub b { color: var(--accent-2); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: rgba(245,158,11,0.3); }
  .card h2 {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .icon { font-size: 18px; }

  .loading-pulse {
    color: var(--text-fade);
    font-size: 13px;
    font-style: italic;
  }
  .err-msg {
    color: var(--bad);
    font-size: 12px;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    padding: 8px 12px;
    border-radius: 8px;
  }

  /* ===== Tabs ===== */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .tabs button {
    background: none;
    border: 0;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.active {
    color: var(--accent-2);
    border-bottom-color: var(--accent-2);
  }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ===== World Cup card ===== */
  .wc-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 70vh;
    overflow-y: auto;
    padding-right: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .wc-list::-webkit-scrollbar { width: 6px; }
  .wc-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .wc-day {
    color: var(--accent-2);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 12px 4px 6px;
    border-bottom: 1px solid var(--border);
    margin-top: 4px;
  }
  .wc-day:first-child { margin-top: 0; padding-top: 0; }
  .wc-day span {
    color: var(--text-fade);
    font-weight: 500;
    margin-left: 8px;
    text-transform: none;
    letter-spacing: 0;
  }
  .wc-match .badge-fallback {
    width: 24px; height: 24px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  .wc-match {
    display: grid;
    grid-template-columns: 50px 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .wc-match.live { border-color: var(--bad); background: rgba(239,68,68,0.06); }
  .wc-match .when {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.3;
  }
  .wc-match .when .t { color: var(--text); font-weight: 600; font-size: 13px; }
  .wc-match .team {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .wc-match .team.away { justify-content: flex-end; }
  .wc-match .team img {
    width: 24px;
    height: 24px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .wc-match .team .nm {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wc-match .vs {
    font-size: 11px;
    color: var(--text-fade);
    font-weight: 600;
  }
  .wc-match .score {
    font-size: 14px;
    font-weight: 800;
    color: var(--accent-2);
    font-variant-numeric: tabular-nums;
  }
  @media (max-width: 600px) {
    .wc-match { grid-template-columns: 44px 1fr auto 1fr; gap: 6px; padding: 8px; }
    .wc-match .team .nm { font-size: 11px; }
    .wc-match .team img { width: 20px; height: 20px; }
  }

  /* ===== BXH ===== */
  .bxh-wrap {
    max-height: 70vh;
    overflow-y: auto;
    padding-right: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .bxh-wrap::-webkit-scrollbar { width: 6px; }
  .bxh-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .bxh-group { margin-bottom: 16px; }
  .bxh-group h3 {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-2);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0 0 6px;
  }
  .bxh-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
  }
  .bxh-table col.c-pos { width: 28px; }
  .bxh-table col.c-team { width: auto; }
  .bxh-table col.c-num { width: 36px; }
  .bxh-table col.c-pts { width: 44px; }
  .bxh-table th, .bxh-table td {
    padding: 6px 4px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  .bxh-table th {
    color: var(--text-fade);
    font-size: 10px;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .bxh-table .pos { width: 24px; color: var(--text-dim); }
  .bxh-table .team-cell {
    text-align: left;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text);
    font-weight: 600;
  }
  .bxh-table .team-cell img {
    width: 18px; height: 18px; object-fit: contain;
  }
  .bxh-table .team-cell span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bxh-table .pts { color: var(--accent-2); font-weight: 700; }
  .bxh-table tr.qualified .pos { color: var(--good); font-weight: 700; }
  @media (max-width: 600px) {
    .bxh-table { font-size: 11px; }
    .bxh-table col.c-num { width: 28px; }
    .bxh-table col.c-pts { width: 36px; }
  }

  /* ===== Trận sắp tới (hero) ===== */
  .next-hero {
    background: linear-gradient(135deg, rgba(245,158,11,0.12) 0%, rgba(15,23,42,0.6) 100%);
    border: 1px solid rgba(245,158,11,0.3);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .next-hero::before {
    content: "";
    position: absolute;
    top: -60px; right: -60px;
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(245,158,11,0.2), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .next-hero .lbl {
    font-size: 11px;
    color: var(--accent-2);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }
  .next-hero .nh-match {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 12px 0 6px;
    flex-wrap: wrap;
  }
  .next-hero .nh-team {
    display: flex; align-items: center; gap: 8px;
    font-size: 18px; font-weight: 700; color: var(--text);
  }
  .next-hero .nh-team img { width: 32px; height: 32px; object-fit: contain; }
  .next-hero .nh-vs {
    font-size: 14px;
    color: var(--text-fade);
    font-weight: 600;
    padding: 0 8px;
  }
  .next-hero .nh-meta {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.6;
  }
  .next-hero .nh-meta b { color: var(--accent-2); font-variant-numeric: tabular-nums; }
  .next-hero .nh-cd {
    display: inline-block;
    margin-top: 6px;
    background: var(--accent-2);
    color: #0a0e1a;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .next-hero.live .nh-cd {
    background: var(--bad); color: #fff;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.6 } }

  /* ===== Vua phá lưới ===== */
  .scorers-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    table-layout: fixed;
  }
  .scorers-table col.s-pos { width: 30px; }
  .scorers-table col.s-player { width: auto; }
  .scorers-table col.s-num { width: 40px; }
  .scorers-table th, .scorers-table td {
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .scorers-table th {
    color: var(--text-fade);
    font-size: 10px;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .scorers-table .pos { color: var(--text-dim); }
  .scorers-table tr.top1 .pos { color: var(--accent-2); font-weight: 800; }
  .scorers-table .player-cell {
    text-align: left;
    display: flex; align-items: center; gap: 8px;
    color: var(--text); font-weight: 600;
    min-width: 0;
  }
  .scorers-table .player-cell img { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; }
  .scorers-table .player-cell .nm {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .scorers-table .player-cell small {
    color: var(--text-fade); font-weight: 400; font-size: 11px;
    margin-top: 1px; display: block;
  }
  .scorers-table .goals { color: var(--accent-2); font-weight: 800; font-size: 14px; }

  /* ===== Lịch sử WC ===== */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 480px;
    overflow-y: auto;
    padding-right: 6px;
    scrollbar-width: thin;
  }
  .history-list::-webkit-scrollbar { width: 6px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .history-row {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .history-row.special {
    border-color: rgba(245,158,11,0.4);
    background: linear-gradient(90deg, rgba(245,158,11,0.08), transparent);
  }
  .history-row .year {
    font-weight: 800;
    color: var(--accent-2);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
  }
  .history-row .winner {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text); font-weight: 600;
  }
  .history-row .winner img { width: 22px; height: 22px; object-fit: contain; }
  .history-row .winner small {
    display: block; color: var(--text-fade); font-size: 10px;
    font-weight: 400; margin-top: 1px;
  }
  .history-row .host {
    color: var(--text-dim);
    font-size: 11px;
    text-align: right;
  }
  @media (max-width: 600px) {
    .next-hero { padding: 16px; }
    .next-hero .nh-team { font-size: 15px; }
    .scorers-table { font-size: 12px; }
    .history-row { grid-template-columns: 48px 1fr auto; padding: 8px 10px; gap: 8px; }
  }

  footer {
    text-align: center;
    color: var(--text-fade);
    font-size: 12px;
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1><span class="trophy">🏆</span> World Cup 2026</h1>
    <div class="sub">Lịch thi đấu · <b id="wcMeta">đang tải…</b></div>
  </header>

  <!-- Trận sắp tới (hero) -->
  <div class="next-hero" id="nextHero" style="display:none">
    <div class="lbl">⚡ Trận tiếp theo</div>
    <div class="nh-match" id="nhMatch"></div>
    <div class="nh-meta" id="nhMeta"></div>
    <div class="nh-cd" id="nhCd"></div>
  </div>

  <div class="grid">
    <div class="card" style="grid-column: 1 / -1">
      <div class="tabs" id="wcTabs">
        <button class="active" data-tab="schedule">Lịch thi đấu</button>
        <button data-tab="standings">Bảng xếp hạng</button>
      </div>
      <div class="tab-pane active" data-pane="schedule">
        <div class="wc-list" id="wcBlock">
          <div class="loading-pulse">Đang tải lịch thi đấu…</div>
        </div>
      </div>
      <div class="tab-pane" data-pane="standings">
        <div class="bxh-wrap" id="bxhBlock">
          <div class="loading-pulse">Đang tải bảng xếp hạng…</div>
        </div>
      </div>
    </div>
  </div>

  <div class="grid">
    <!-- Vua phá lưới -->
    <div class="card">
      <h2><span class="icon">⚽</span> Vua phá lưới <span style="font-size:11px; color:var(--text-fade); font-weight:400; text-transform:none; letter-spacing:0" id="scorersMeta">—</span></h2>
      <div id="scorersBlock">
        <div class="loading-pulse">Đang tải…</div>
      </div>
    </div>

    <!-- Lịch sử WC -->
    <div class="card">
      <h2><span class="icon">🏛️</span> Lịch sử nhà vô địch</h2>
      <div class="history-list" id="historyBlock"></div>
    </div>
  </div>

  <footer>
    Nguồn: openfootball / Football-Data.org · TheSportsDB · flagcdn · Wikipedia
  </footer>

</div>

<script>
document.querySelectorAll("#wcTabs button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#wcTabs button").forEach((b) => b.classList.toggle("active", b === btn));
    const target = btn.dataset.tab;
    document.querySelectorAll('[data-pane]').forEach((p) => p.classList.toggle("active", p.dataset.pane === target));
  });
});

function renderStandings(standings) {
  const block = document.getElementById("bxhBlock");
  if (!standings || !standings.length) {
    block.innerHTML = `<div class="err-msg">Chưa có dữ liệu bảng xếp hạng</div>`;
    return;
  }
  const badge = (url) => url
    ? `<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="badge-fallback" style="width:18px;height:18px"></div>`;
  block.innerHTML = standings.map((g) => `
    <div class="bxh-group">
      <h3>${g.group}</h3>
      <table class="bxh-table">
        <colgroup>
          <col class="c-pos"><col class="c-team">
          <col class="c-num"><col class="c-num"><col class="c-num"><col class="c-num">
          <col class="c-num"><col class="c-num"><col class="c-num"><col class="c-pts">
        </colgroup>
        <thead>
          <tr><th class="pos">#</th><th style="text-align:left">Đội</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>
        </thead>
        <tbody>
          ${g.table.map((t) => `
            <tr class="${t.pos <= 2 ? "qualified" : ""}">
              <td class="pos">${t.pos}</td>
              <td><div class="team-cell">${badge(t.badge)}<span>${t.team}</span></div></td>
              <td>${t.played}</td>
              <td>${t.won}</td>
              <td>${t.drawn}</td>
              <td>${t.lost}</td>
              <td>${t.gf}</td>
              <td>${t.ga}</td>
              <td>${t.gd > 0 ? "+" + t.gd : t.gd}</td>
              <td class="pts">${t.pts}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `).join("");
}

async function loadSports() {
  const block = document.getElementById("wcBlock");
  const meta = document.getElementById("wcMeta");
  try {
    const r = await fetch("/api/sports");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const finished = (d.matches || []).filter((m) => m.homeScore != null && m.awayScore != null);
    console.log(`[WC] source=${d.source} | total=${d.total} | finished=${finished.length} | updated=${new Date(d.updated).toLocaleString("vi-VN")}`);
    if (finished.length) console.log("[WC] sample finished:", finished.slice(0, 3).map((m) => `${m.home} ${m.homeScore}-${m.awayScore} ${m.away}`));
    renderStandings(d.standings);
    const all = d.matches || [];
    const nowMs = Date.now();
    const matches = all.filter((m) => !m.ts || m.ts >= nowMs - 3 * 3600 * 1000);
    if (!matches.length) {
      block.innerHTML = `<div class="err-msg">Chưa có lịch thi đấu</div>`;
      return;
    }
    meta.textContent = `${matches.length}/${d.total || matches.length} trận còn lại${d.source === "football-data" ? " · live" : ""}`;

    const fmt = (ts) => {
      if (!ts) return { d: "—", t: "—" };
      const dt = new Date(ts);
      const dd = String(dt.getDate()).padStart(2, "0");
      const mm = String(dt.getMonth() + 1).padStart(2, "0");
      const hh = String(dt.getHours()).padStart(2, "0");
      const mi = String(dt.getMinutes()).padStart(2, "0");
      return { d: `${dd}/${mm}`, t: `${hh}:${mi}` };
    };

    let lastDate = "";
    block.innerHTML = matches.map((m) => {
      const { d, t } = fmt(m.ts);
      const dt = m.ts ? new Date(m.ts) : null;
      const dKey = dt ? `${dt.getDate()}-${dt.getMonth()}` : "";
      let header = "";
      if (dKey !== lastDate && dt) {
        lastDate = dKey;
        const wd = ["CN","T2","T3","T4","T5","T6","T7"][dt.getDay()];
        const tag = m.group || m.round || "";
        header = `<div class="wc-day">${wd} ${d} <span>${tag}</span></div>`;
      }
      const isLive = m.ts && nowMs >= m.ts && nowMs < m.ts + 2 * 3600 * 1000;
      const hasScore = m.homeScore != null && m.awayScore != null;
      const center = hasScore
        ? `<div class="score">${m.homeScore} - ${m.awayScore}</div>`
        : `<div class="vs">VS</div>`;
      const badge = (url) => url
        ? `<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`
        : `<div class="badge-fallback"></div>`;
      return `${header}
        <div class="wc-match ${isLive ? "live" : ""}">
          <div class="when"><div class="t">${t}</div></div>
          <div class="team">${badge(m.homeBadge)}<div class="nm">${m.home}</div></div>
          ${center}
          <div class="team away"><div class="nm">${m.away}</div>${badge(m.awayBadge)}</div>
        </div>
      `;
    }).join("");
  } catch (e) {
    block.innerHTML = `<div class="err-msg">Không tải được lịch (${e.message})</div>`;
  }
}

/* ===== Trận sắp tới (countdown live) ===== */
let _nextMatch = null;
function renderNextHero() {
  const hero = document.getElementById("nextHero");
  if (!_nextMatch || !_nextMatch.ts) { hero.style.display = "none"; return; }
  hero.style.display = "block";
  const m = _nextMatch;
  const nowMs = Date.now();
  const isLive = nowMs >= m.ts && nowMs < m.ts + 2 * 3600 * 1000;
  hero.classList.toggle("live", isLive);
  const dt = new Date(m.ts);
  const wd = ["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"][dt.getDay()];
  const ds = `${String(dt.getDate()).padStart(2,"0")}/${String(dt.getMonth()+1).padStart(2,"0")}/${dt.getFullYear()}`;
  const hh = String(dt.getHours()).padStart(2,"0");
  const mi = String(dt.getMinutes()).padStart(2,"0");
  const badge = (url) => url ? `<img src="${url}" alt="" onerror="this.style.display='none'">` : "";
  document.getElementById("nhMatch").innerHTML = `
    <div class="nh-team">${badge(m.homeBadge)}<span>${m.home}</span></div>
    <div class="nh-vs">VS</div>
    <div class="nh-team">${badge(m.awayBadge)}<span>${m.away}</span></div>
  `;
  const meta = [
    m.group || m.round ? `<b>${m.group || m.round}</b>` : "",
    `🗓️ ${wd}, <b>${ds}</b> · 🕐 <b>${hh}:${mi}</b>`,
    m.venue ? `📍 ${m.venue}` : ""
  ].filter(Boolean).join(" · ");
  document.getElementById("nhMeta").innerHTML = meta;

  const cd = document.getElementById("nhCd");
  if (isLive) {
    cd.textContent = "🔴 ĐANG ĐÁ";
  } else if (m.ts < nowMs) {
    cd.textContent = "Đã kết thúc";
  } else {
    const diff = m.ts - nowMs;
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    cd.textContent = days > 0
      ? `Còn ${days} ngày ${hours}h ${mins}p`
      : hours > 0 ? `Còn ${hours}h ${mins}p ${secs}s`
      : `Còn ${mins}p ${secs}s`;
  }
}
setInterval(renderNextHero, 1000);

/* ===== Vua phá lưới ===== */
function renderScorers(scorers) {
  const block = document.getElementById("scorersBlock");
  const meta = document.getElementById("scorersMeta");
  if (!scorers || !scorers.length) {
    block.innerHTML = `<p class="loading-pulse">Chưa có dữ liệu (giải chưa khai mạc hoặc chưa cấu hình Football-Data API key).</p>`;
    return;
  }
  meta.textContent = `Top ${scorers.length}`;
  block.innerHTML = `
    <table class="scorers-table">
      <colgroup>
        <col class="s-pos"><col class="s-player">
        <col class="s-num"><col class="s-num"><col class="s-num">
      </colgroup>
      <thead>
        <tr><th>#</th><th style="text-align:left">Cầu thủ</th><th>⚽</th><th>🅰️</th><th>Trận</th></tr>
      </thead>
      <tbody>
        ${scorers.map((s, i) => `
          <tr class="${i === 0 ? "top1" : ""}">
            <td class="pos">${i + 1}</td>
            <td><div class="player-cell">
              ${s.teamBadge ? `<img src="${s.teamBadge}" alt="" onerror="this.style.display='none'">` : ""}
              <div class="nm">${s.player || "—"}<small>${s.team || s.nationality || ""}</small></div>
            </div></td>
            <td class="goals">${s.goals ?? 0}</td>
            <td>${s.assists ?? 0}</td>
            <td>${s.matches ?? 0}</td>
          </tr>`).join("")}
      </tbody>
    </table>
  `;
}

/* ===== Cập nhật từ loadSports ===== */
async function bootstrapExtras() {
  try {
    const r = await fetch("/api/sports");
    if (!r.ok) return;
    const d = await r.json();
    renderScorers(d.scorers || []);
    const nowMs = Date.now();
    const future = (d.matches || []).filter((m) => m.ts && m.ts >= nowMs - 2 * 3600 * 1000);
    _nextMatch = future[0] || null;
    renderNextHero();
  } catch (e) {
    console.warn("[wc-extras]", e);
  }
}
bootstrapExtras();

loadSports();
