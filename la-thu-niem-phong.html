<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lá thư niêm phong ✦ Thị Huyền ❤️ Hữu Phước</title>
  <link rel="icon" href="/icons/love/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/love/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta property="og:title" content="Lá thư niêm phong — Gửi Thị Huyền 💌">
  <meta property="og:description" content="Một lá thư đang chờ em mở con dấu 💌">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://love.personal.io.vn/images/love/love-4.jpg">
  <meta property="og:url" content="https://love.personal.io.vn/la-thu-niem-phong.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Một lá thư Hữu Phước gửi Thị Huyền, đang chờ được mở 💌">
  <meta name="theme-color" content="#10070f">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;500;600&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose:   #ff6b8a;
      --rose2:  #ff4d73;
      --pink:   #ffb3c6;
      --gold:   #f5c842;
      --gold2:  #fde68a;
      --white:  #fff;
      --mut:    rgba(255,255,255,0.55);
      --border: rgba(255,255,255,0.15);
      --glass:  rgba(26,10,20,0.55);
      --ink:    #3d1622;           /* mau muc tren giay */
      --ink2:   #8a2a43;
      --paper:  #fffaf2;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --vh: 100vh;
    }
    @supports (height: 100dvh) { :root { --vh: 100dvh; } }

    html, body { height: 100%; overflow: hidden; }
    /* Mau nen DAC: Safari iPhone lay mau nay to vung thanh trang thai va duoi day */
    html { background-color: #10070f; }
    body {
      background: radial-gradient(ellipse at 50% 42%, #3a1226 0%, #1a0a14 48%, #07030a 100%);
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
      user-select: none; -webkit-user-select: none;
    }

    #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* ── THANH TREN ─────────────────────────────────────── */
    .bar {
      position: fixed; z-index: 6;
      top: calc(12px + var(--safe-t)); left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .bar > * { pointer-events: auto; }
    .pill {
      height: 40px; min-width: 40px; padding: 0 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      color: rgba(255,255,255,0.85);
      font: 500 0.82rem/1 'Inter', sans-serif;
      text-decoration: none; cursor: pointer;
    }
    .pill:hover { background: rgba(255,77,115,0.25); border-color: rgba(255,107,138,0.5); }
    .pill.icon { width: 40px; padding: 0; font-size: 1rem; }
    .pill.on { border-color: rgba(255,107,138,0.5); }

    /* ── PHONG THU ──────────────────────────────────────── */
    .stage {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 34px;
      padding: calc(70px + var(--safe-t)) 20px calc(24px + var(--safe-b));
    }
    .env-wrap {
      position: relative;
      width: min(84vw, 440px, calc((var(--vh) - 300px) * 1.56));
      min-width: 220px;
      cursor: pointer;
      animation: bob 3.4s ease-in-out infinite;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .env-wrap::after {              /* bong do duoi phong thu */
      content: '';
      position: absolute; left: 12%; right: 12%; bottom: -30px; height: 18px;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(0,0,0,0.5), rgba(0,0,0,0));
    }
    .opened .env-wrap { animation: none; }
    .env-wrap.gone { opacity: 0; transform: translateY(70px) scale(0.9); pointer-events: none; }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-1.2deg); }
      50%      { transform: translateY(-10px) rotate(1.2deg); }
    }

    .env { position: relative; width: 100%; aspect-ratio: 1.56; perspective: 1400px; }
    .env > * { position: absolute; }
    .env-back {
      inset: 0; border-radius: 6px;
      background: linear-gradient(180deg, #caa18b, #e2c3ae);
      box-shadow: 0 26px 60px rgba(0,0,0,0.55);
    }
    .peek {                         /* la thu nam trong phong bi */
      left: 6%; right: 6%; top: 5%; height: 88%; z-index: 2;
      border-radius: 4px;
      background:
        repeating-linear-gradient(180deg, transparent 0 17px, rgba(138,42,67,0.14) 17px 18px) 0 46% / 100% 50% no-repeat,
        var(--paper);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 7% 9%;
      transition: transform 1.2s cubic-bezier(.3,.9,.3,1);
    }
    .peek b { font-family: 'Dancing Script', cursive; font-size: clamp(1rem, 5vw, 1.5rem); color: var(--ink2); }
    .env-front {
      inset: 0; z-index: 3;
      background: linear-gradient(180deg, #f6e6d7, #ecd4c0);
      clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    }
    .env-front::before, .env-front::after { content: ''; position: absolute; inset: 0; }
    .env-front::before { background: linear-gradient(90deg, rgba(150,90,70,0.16), rgba(150,90,70,0) 55%); clip-path: polygon(0 0, 50% 55%, 0 100%); }
    .env-front::after  { background: linear-gradient(270deg, rgba(150,90,70,0.16), rgba(150,90,70,0) 55%); clip-path: polygon(100% 0, 50% 55%, 100% 100%); }
    .flap {
      left: 0; right: 0; top: 0; height: 58%; z-index: 4;
      transform-origin: 50% 0;
      transition: transform 0.85s cubic-bezier(.4,.1,.3,1);
      filter: drop-shadow(0 5px 5px rgba(80,30,20,0.22));
    }
    .flap::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, #f3e0cf, #e6cbb6);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    /* Con dau sap: hai nua ghep lai, vo ra hai ben khi mo */
    .seal {
      left: 50%; top: 58%; z-index: 5;
      width: clamp(56px, 16%, 76px); aspect-ratio: 1;
      transform: translate(-50%, -62%);
      border: none; background: none; padding: 0;
      cursor: pointer;
    }
    .seal::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      animation: ping 2.2s ease-out infinite;
    }
    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 rgba(245,200,66,0.5); }
      100% { box-shadow: 0 0 0 18px rgba(245,200,66,0); }
    }
    .seal-l, .seal-r {
      position: absolute; inset: 0;
      border-radius: 47% 53% 50% 50% / 52% 48% 52% 48%;
      background: radial-gradient(circle at 36% 30%, #e0465f 0%, #a8142f 55%, #6e0a20 100%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.35), inset 0 -4px 8px rgba(0,0,0,0.35), inset 0 3px 6px rgba(255,255,255,0.22);
      transition: transform 0.9s cubic-bezier(.3,.7,.4,1), opacity 0.9s ease;
    }
    .seal-l { clip-path: polygon(0 0, 54% 0, 45% 36%, 57% 60%, 47% 100%, 0 100%); }
    .seal-r { clip-path: polygon(54% 0, 100% 0, 100% 100%, 47% 100%, 57% 60%, 45% 36%); }
    .seal-h {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      font-size: 1.9rem; color: rgba(70,0,15,0.55);
      text-shadow: 0 1px 0 rgba(255,255,255,0.28);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* Cac buoc mo thu (JS bat lan luot) */
    .env.s1 .seal-l { transform: translate(-48px, 80px) rotate(-55deg); opacity: 0; }
    .env.s1 .seal-r { transform: translate(48px, 90px) rotate(48deg); opacity: 0; }
    .env.s1 .seal-h { opacity: 0; }
    .env.s1 .seal::after { animation: none; }
    .env.s2 .flap { transform: rotateX(180deg); }
    .env.s3 .flap { z-index: 1; }
    .env.s4 .peek { transform: translateY(-56%); }

    .env-label { text-align: center; transition: opacity 0.6s ease; }
    .opened .env-label { opacity: 0; }
    .env-to { font-family: 'Dancing Script', cursive; font-size: clamp(1.8rem, 8vw, 2.4rem); color: var(--pink); }
    .env-when { margin-top: 4px; font-size: 0.8rem; color: var(--mut); letter-spacing: 0.04em; }
    .env-hint { margin-top: 14px; font-size: 0.78rem; color: var(--gold2); animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

    /* ── TO THU ─────────────────────────────────────────── */
    .paper {
      position: fixed; z-index: 4;
      left: 50%; top: calc(50% + 24px + var(--safe-t) / 2);
      width: min(92vw, 640px);
      max-height: calc(var(--vh) - 104px - var(--safe-t) - var(--safe-b));
      overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
      padding: 34px clamp(20px, 6vw, 44px) 30px;
      border-radius: 6px;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255,214,222,0.45), rgba(255,214,222,0) 55%),
        radial-gradient(ellipse at 100% 100%, rgba(240,210,180,0.35), rgba(240,210,180,0) 50%),
        var(--paper);
      color: var(--ink);
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      opacity: 0; visibility: hidden;
      transform: translate(-50%, -46%) scale(0.92);
      transition: opacity 0.9s ease, transform 0.9s cubic-bezier(.2,.8,.2,1), visibility 0.9s;
      user-select: text; -webkit-user-select: text;
    }
    .paper.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%); }
    .pp-date { text-align: right; font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.86rem; color: #9a6b75; }
    .pp-title { margin: 14px 0 18px; font-family: 'Playfair Display', serif; font-size: clamp(1.25rem, 5vw, 1.5rem); color: var(--ink2); }
    .pp-body { font-family: 'Dancing Script', cursive; font-weight: 500; font-size: clamp(1.32rem, 5.2vw, 1.62rem); line-height: 1.6; }
    .pp-body p { margin-bottom: 0.7em; }
    .w { opacity: 0; }
    .w.in { animation: ink 0.6s ease-out forwards; }
    .w.now { opacity: 1; }
    @keyframes ink {
      from { opacity: 0; filter: blur(3px); transform: translateY(3px); }
      to   { opacity: 1; filter: none; transform: none; }
    }

    .pp-end {
      margin-top: 22px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      opacity: 0; visibility: hidden;
      transition: opacity 1s ease, visibility 1s;
    }
    .pp-end.show { opacity: 1; visibility: visible; }
    .stamp {
      width: 124px; height: 124px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 4px double rgba(168,20,47,0.75);
      color: #a8142f;
      transform: rotate(-12deg);
      opacity: 0.9;
    }
    .pp-end.show .stamp { animation: stampIn 0.55s 0.2s cubic-bezier(.3,1.6,.5,1) both; }
    @keyframes stampIn { from { transform: rotate(-12deg) scale(2.2); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 0.9; } }
    .stamp b { font-family: 'Playfair Display', serif; font-size: 2.1rem; line-height: 1; font-variant-numeric: lining-nums; }
    .stamp span { margin-top: 4px; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
    .pp-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .pp-btn {
      padding: 11px 18px; border-radius: 999px;
      border: 1px solid rgba(138,42,67,0.35);
      background: rgba(138,42,67,0.06);
      color: var(--ink2);
      font: 600 0.86rem 'Inter', sans-serif;
      text-decoration: none; cursor: pointer;
    }
    .pp-btn:hover { background: rgba(138,42,67,0.14); }

    .reveal-all {
      position: fixed; z-index: 5;
      left: 50%; bottom: calc(12px + var(--safe-b));
      transform: translateX(-50%);
      padding: 8px 16px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(26,10,20,0.6);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: rgba(255,255,255,0.85);
      font: 500 0.76rem 'Inter', sans-serif;
      cursor: pointer;
      opacity: 0; visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s;
    }
    .reveal-all.show { opacity: 1; visibility: visible; }

    /* ── CANH HOA ROI ───────────────────────────────────── */
    .petals { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
    .petal {
      position: absolute; top: -24px;
      border-radius: 50% 0 50% 0;
      opacity: 0;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.85; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(calc(var(--vh) + 40px)) translateX(var(--px)) rotate(var(--pr)); opacity: 0; }
    }

    /* Man thap (dien thoai xoay ngang): phong thu nho lai */
    @media (max-height: 500px) {
      .stage { gap: 18px; padding-top: 60px; }
      .env-wrap { width: min(60vw, calc((var(--vh) - 170px) * 1.56)); }
      .env-hint { margin-top: 6px; }
      .paper { top: calc(50% + 22px); max-height: calc(var(--vh) - 70px); padding-top: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .env-wrap, .env-hint, .seal::after { animation: none; }
      .w.in { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>

<canvas id="sky"></canvas>

<header class="bar">
  <a class="pill" href="love.html">‹ Trang tình yêu</a>
  <button class="pill icon" id="music" aria-label="Bật/tắt nhạc" title="Bật/tắt nhạc">🎵</button>
</header>

<main class="stage" id="stage">
  <div class="env-wrap" id="envWrap" role="button" tabindex="0" aria-label="Mở thư">
    <div class="env" id="env">
      <div class="env-back"></div>
      <div class="peek"><b>Gửi em 💌</b></div>
      <div class="env-front"></div>
      <div class="flap"></div>
      <button class="seal" id="seal" aria-label="Mở con dấu">
        <span class="seal-l"></span><span class="seal-r"></span><span class="seal-h">♥</span>
      </button>
    </div>
  </div>
  <div class="env-label">
    <div class="env-to">Gửi Thị Huyền 💌</div>
    <div class="env-when" id="envWhen"></div>
    <div class="env-hint">Chạm vào con dấu để mở thư</div>
  </div>
</main>

<div class="petals" id="petals"></div>

<article class="paper" id="paper" aria-live="polite">
  <div class="pp-date" id="ppDate"></div>
  <h1 class="pp-title" id="ppTitle"></h1>
  <div class="pp-body" id="ppBody"></div>
  <div class="pp-end" id="ppEnd">
    <div class="stamp"><b id="stampN">0</b><span>ngày bên nhau</span></div>
    <div class="pp-actions">
      <button class="pp-btn" id="rewrite">↻ Đọc lại</button>
      <a class="pp-btn" href="love.html">‹ Trang tình yêu</a>
    </div>
  </div>
</article>

<button class="reveal-all" id="revealAll">Chạm để hiện hết ›</button>

<script src="js/milestones.js"></script>
<script src="js/letters.js"></script>
<script>
(() => {
  'use strict';
  const { START, DAY, fmtVN, dayKey } = Milestones;

  // Bai dau phat ngay khi mo thu; het bai thi sang bai ke, het danh sach thi quay lai bai dau
  const PLAYLIST = [
    'music/love/yeu-em-hon-moi-ngay.mp3',
    'music/love/you-are-my-crush.mp3',
    'music/love/giai-cuu-the-gioi.mp3',
  ];
  const WORD_MS = 95;            // moi chu hien sau chu truoc bao lau
  const COMMA_MS = 140;          // nghi them sau dau phay
  const STOP_MS = 320;           // nghi them sau dau cham / cham than / hoi
  const PARA_MS = 650;           // nghi them truoc moi doan moi
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

  // ── NGAY DANG XEM ──────────────────────────────────────────
  // Them ?ngay=2026-10-18 vao dia chi de xem truoc dung ngay ky niem.
  const TODAY = (() => {
    const m = (new URLSearchParams(location.search).get('ngay') || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    const d = m ? new Date(+m[1], m[2] - 1, +m[3]) : new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  })();
  const N = Math.max(0, Math.round((TODAY - new Date(START)) / DAY));
  $('stampN').textContent = N.toLocaleString('vi-VN');

  // ── CANVAS NEN: bui sao ──────────────────────────────────────
  const cv = $('sky');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dust = [];
  function layout() {
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(200, (W * H) / 7000));
    dust = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 0.9 + 0.2, a: Math.random() * 0.4 + 0.1,
      ph: Math.random() * 6.283, sp: Math.random() * 0.8 + 0.2,
    }));
  }
  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    for (const d of dust) {
      ctx.globalAlpha = d.a * (0.6 + 0.4 * Math.sin(t * 0.001 * d.sp + d.ph));
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  // ── CHON THU ─────────────────────────────────────────────────
  // Thu mo hom nay; khong co thi thu gan nhat da mo; chua thu nao toi ngay thi
  // la thu dau tien (giong "loi di rieng" o trang love).
  let letter = null;
  function pickLetter(list) {
    const key = dayKey(TODAY);
    const sorted = list.slice().sort((a, b) => a.openAt.localeCompare(b.openAt));
    return sorted.find((l) => l.openAt === key)
      || sorted.filter((l) => l.openAt <= key).pop()
      || sorted[0] || null;
  }

  const dateOf = (key) => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d); };

  // ── VIET THU: tach tung chu ──────────────────────────────────
  const bodyEl = $('ppBody'), paperEl = $('paper'), endEl = $('ppEnd'), revealBtn = $('revealAll');
  let words = [], at = [], shown = 0, writing = false, writeStart = 0;

  function renderLetter() {
    if (!letter) {
      $('ppTitle').textContent = 'Chưa có lá thư nào…';
      bodyEl.textContent = '';
      return;
    }
    const d = dateOf(letter.openAt);
    $('ppDate').textContent = `Ngày ${d.getDate()} tháng ${d.getMonth() + 1} năm ${d.getFullYear()}`;
    $('ppTitle').textContent = letter.title;

    const text = Letters.decode(letter.body, letter.openAt).trim();
    bodyEl.textContent = '';
    words = []; at = [];
    let t = 0;
    text.split(/\n\s*\n/).forEach((para, pi) => {
      const p = document.createElement('p');
      if (pi > 0) t += PARA_MS;
      para.split('\n').forEach((line, li) => {
        if (li > 0) p.appendChild(document.createElement('br'));
        line.split(/\s+/).filter(Boolean).forEach((word, wi) => {
          if (wi > 0) p.appendChild(document.createTextNode(' '));
          const s = document.createElement('span');
          s.className = 'w';
          s.textContent = word;
          p.appendChild(s);
          words.push(s); at.push(t);
          t += WORD_MS + (/[.!?…]$/.test(word) ? STOP_MS : /[,;:—]$/.test(word) ? COMMA_MS : 0);
        });
      });
      bodyEl.appendChild(p);
    });
  }

  // Tu cuon theo dong dang viet — tru khi nguoi doc tu cuon len doc lai
  let userScrolled = false, lastFollow = 0;
  ['wheel', 'touchmove'].forEach((ev) => paperEl.addEventListener(ev, () => { userScrolled = true; }, { passive: true }));
  paperEl.addEventListener('scroll', () => {
    if (paperEl.scrollTop + paperEl.clientHeight >= paperEl.scrollHeight - 60) userScrolled = false;
  }, { passive: true });

  function follow(now, el) {
    if (userScrolled || now - lastFollow < 450 || !el) return;
    const pr = paperEl.getBoundingClientRect(), wr = el.getBoundingClientRect();
    if (wr.bottom > pr.bottom - 70) {
      lastFollow = now;
      paperEl.scrollBy({ top: wr.bottom - pr.bottom + 140, behavior: 'smooth' });
    }
  }

  function writeTick(now) {
    if (!writing) return;
    const e = now - writeStart;
    while (shown < words.length && at[shown] <= e) words[shown++].classList.add('in');
    follow(now, words[shown - 1]);
    if (shown >= words.length) { finishWriting(); return; }
    requestAnimationFrame(writeTick);
  }

  function startWriting() {
    words.forEach((w) => w.classList.remove('in', 'now'));
    shown = 0; userScrolled = false;
    endEl.classList.remove('show');
    paperEl.scrollTop = 0;
    if (reduceMotion || !words.length) { showAll(); return; }
    writing = true;
    writeStart = performance.now();
    revealBtn.classList.add('show');
    requestAnimationFrame(writeTick);
  }

  function showAll() {
    words.forEach((w) => w.classList.add('now'));
    shown = words.length;
    finishWriting();
  }

  function finishWriting() {
    writing = false;
    revealBtn.classList.remove('show');
    endEl.classList.add('show');
    if (!userScrolled) setTimeout(() => endEl.scrollIntoView({ behavior: 'smooth', block: 'end' }), 400);
  }

  revealBtn.addEventListener('click', showAll);
  $('rewrite').addEventListener('click', startWriting);

  // ── NHAC ─────────────────────────────────────────────────────
  const musicEl = $('music');
  let track = 0, musicOn = false;
  const audio = new Audio(PLAYLIST[0]);
  audio.preload = 'auto';
  // Doi bai tren CUNG mot phan tu audio: iPhone chi cho phat tiep khong can
  // cham neu van la phan tu da duoc mo khoa bang lan cham mo thu
  audio.addEventListener('ended', () => {
    track = (track + 1) % PLAYLIST.length;
    audio.src = PLAYLIST[track];
    if (musicOn) audio.play().catch(() => {});
  });
  function setMusic(on) {
    musicOn = on;
    musicEl.textContent = on ? '🔊' : '🎵';
    musicEl.classList.toggle('on', on);
    if (!on) { audio.pause(); return; }
    audio.volume = 0;
    audio.play().catch(() => setMusic(false));
    const t0 = performance.now();
    const fade = (t) => {
      const p = clamp01((t - t0) / 3000);
      audio.volume = 0.5 * p;
      if (p < 1 && musicOn) requestAnimationFrame(fade);
    };
    requestAnimationFrame(fade);
  }
  musicEl.addEventListener('click', () => setMusic(!musicOn));

  // ── GIU MAN HINH SANG ────────────────────────────────────────
  let wakeLock = null;
  async function keepAwake() {
    if (document.hidden || (wakeLock && !wakeLock.released)) return;
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (musicOn) audio.pause(); return; }
    if (musicOn) audio.play().catch(() => {});
    if (opened) keepAwake();
  });

  // ── CANH HOA ─────────────────────────────────────────────────
  function startPetals() {
    if (reduceMotion) return;
    const box = $('petals');
    const colors = ['#ff6b8a', '#ffb3c6', '#f5c842', '#ff4d73', '#fde68a', '#ffd1dc'];
    for (let i = 0; i < 22; i++) {
      const p = document.createElement('i');
      p.className = 'petal';
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        width: ${Math.random() * 8 + 7}px; height: ${Math.random() * 10 + 9}px;
        background: ${colors[i % colors.length]};
        --px: ${(Math.random() - 0.5) * 220}px; --pr: ${Math.random() * 720}deg;
        animation-duration: ${Math.random() * 8 + 9}s;
        animation-delay: ${Math.random() * 9}s;`;
      box.appendChild(p);
    }
  }

  // ── MO THU ───────────────────────────────────────────────────
  const stageEl = $('stage'), envEl = $('env'), envWrap = $('envWrap');
  let opened = false;

  function openLetter() {
    if (opened) return;
    opened = true;
    setMusic(true);                            // nhac phai bat tu mot lan cham that
    keepAwake();
    stageEl.classList.add('opened');
    if (reduceMotion) {
      envWrap.classList.add('gone');
      paperEl.classList.add('show');
      startWriting();
      return;
    }
    // Sap vo -> nap mo -> thu truot len -> phong bi lui xuong, to thu mo ra
    const steps = [[0, 's1'], [380, 's2'], [800, 's3'], [1100, 's4']];
    steps.forEach(([ms, cls]) => setTimeout(() => envEl.classList.add(cls), ms));
    setTimeout(startPetals, 1100);
    setTimeout(() => envWrap.classList.add('gone'), 2400);
    setTimeout(() => paperEl.classList.add('show'), 2650);
    setTimeout(startWriting, 3400);
  }
  envWrap.addEventListener('click', openLetter);
  envWrap.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLetter(); } });

  // ── TAI THU ──────────────────────────────────────────────────
  fetch('data/letters.json')
    .then((r) => (r.ok ? r.json() : []))
    .catch(() => [])
    .then((list) => {
      letter = pickLetter(Array.isArray(list) ? list : []);
      $('envWhen').textContent = letter ? `Thư của ngày ${fmtVN(dateOf(letter.openAt))}` : 'Chưa có lá thư nào';
      renderLetter();
    });

  addEventListener('resize', layout);
  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
