  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rose: #ff6b8a;
      --pink: #ffb3c6;
      --gold: #f5c842;
      --border: rgba(255,255,255,0.15);
      --glass: rgba(20,6,12,0.55);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    html, body { height: 100%; overflow: hidden; }
    html { background-color: #14060d; }
    body {
      background: radial-gradient(ellipse at 50% 20%, #3a0d1c 0%, #14060d 70%);
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
      user-select: none; -webkit-user-select: none;
    }
    button, a { font-family: inherit; }

    /* ── THANH TREN ─────────────────────────────────────── */
    .bar {
      position: fixed; z-index: 30;
      top: calc(10px + var(--safe-t)); left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      transition: opacity 0.4s ease;
    }
    .playing .bar { opacity: 0; pointer-events: none; }
    .playing.hud-on .bar { opacity: 1; pointer-events: auto; }
    .pill {
      height: 38px; min-width: 38px; padding: 0 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 999px; border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      color: rgba(255,255,255,0.88);
      font: 500 0.8rem/1 'Inter', sans-serif;
      text-decoration: none; cursor: pointer;
    }
    .pill:hover { background: rgba(255,77,115,0.25); border-color: rgba(255,107,138,0.5); }
    .pill.icon { width: 38px; padding: 0; font-size: 1rem; }
    .bar .right { display: flex; gap: 8px; }

    /* ── SAN KHAU 540x960 (9:16), co gian vua man hinh ─────── */
    .wrap { position: fixed; inset: 0; overflow: hidden; }
    .stage {
      position: absolute; left: 50%; top: 50%; width: 540px; height: 960px;
      overflow: hidden; background: #000;
      transform-origin: 50% 50%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      border-radius: 18px;
      font-family: 'Inter', sans-serif;
    }
    .export .stage { left: 0; top: 0; border-radius: 0; box-shadow: none; }
    .stage svg.scene { position: absolute; inset: 0; width: 540px; height: 960px; }

    .dots { position: absolute; top: 26px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; z-index: 5; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.35); box-shadow: 0 0 4px rgba(0,0,0,0.25); }
    .dots i.on { background: #fff; }
    .dots i.cur { width: 22px; border-radius: 4px; background: #fff; }

    .head { position: absolute; top: 52px; left: 24px; right: 24px; text-align: center; z-index: 5; }
    .chip {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      background: rgba(255,255,255,0.9); color: #b8325a;
      font: 600 15px/1 'Inter', sans-serif; letter-spacing: 1.5px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }
    .ttl {
      margin-top: 10px;
      font: 700 44px/1.1 'Dancing Script', cursive; color: #fff; white-space: pre-line;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35), 0 0 2px rgba(0,0,0,0.3);
    }
    .head.light .ttl { color: #b0284f; text-shadow: 0 2px 0 rgba(255,255,255,0.9), 0 0 14px rgba(255,255,255,0.9); }
    .head.hero { top: 200px; }
    .head.hero .ttl { font-size: 66px; margin-top: 16px; }

    .say {
      position: absolute; left: 22px; right: 22px; bottom: 56px; z-index: 6;
      padding: 18px 22px 20px;
      background: rgba(255,250,246,0.94); color: #3b2430;
      border: 2px solid #ffc2d1; border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.22);
      font: 500 21px/1.5 'Inter', sans-serif;
    }
    .say .ghost { color: transparent; }
    .say .caret { display: inline-block; width: 2px; height: 1em; margin-left: 1px; vertical-align: -2px; background: #e8456b; }
    .say::before {                       /* dau may noi nho tren khung chu */
      content: '♥'; position: absolute; top: -15px; left: 26px;
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center;
      background: #ff6b8a; color: #fff; font-size: 14px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }

    .pola {
      position: absolute; z-index: 4; width: 178px;
      padding: 9px 9px 34px; background: #fff;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      border-radius: 3px;
    }
    .pola img, .pola video { display: block; width: 160px; height: 172px; object-fit: cover; background: #eee; }
    .pola video { background: #111; }
    .pola.vid img, .pola:not(.vid) video, .pola:not(.vid) .vtag { display: none; }
    .vtag {                              /* nhan "anh dong" goc anh tu video */
      position: absolute; left: 15px; top: 15px;
      width: 26px; height: 26px; border-radius: 50%; padding-left: 2px;
      display: grid; place-items: center;
      background: rgba(255,255,255,0.88); color: #e8456b;
      font: 700 11px/1 'Inter', sans-serif; font-style: normal;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .pola.sm4 { width: 136px; }
    .pola.sm4 img, .pola.sm4 video { width: 122px; height: 136px; }
    .pola.sm .vtag { left: 12px; top: 12px; width: 22px; height: 22px; font-size: 9px; }
    .pola b { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; font: 700 20px/1 'Dancing Script', cursive; color: #b8325a; }
    .pola.sm { width: 150px; padding: 7px 7px 26px; }
    .pola.sm img, .pola.sm video { width: 136px; height: 150px; }
    .pola.sm b { font-size: 16px; bottom: 5px; }
    .pola.sm::before { width: 52px; height: 18px; top: -9px; }
    .pola::before {                      /* bang dinh */
      content: ''; position: absolute; top: -12px; left: 50%; width: 70px; height: 24px;
      transform: translateX(-50%) rotate(-3deg);
      background: rgba(255,214,226,0.85);
    }
    .veil { position: absolute; inset: 0; z-index: 8; background: #000; pointer-events: none; }
    .flash { position: absolute; inset: 0; z-index: 7; background: #fff; pointer-events: none; opacity: 0; }

    /* ── MAN BAT DAU / KET THUC ─────────────────────────── */
    .cover {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      padding: 24px; text-align: center;
      background: rgba(10,3,7,0.62);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      transition: opacity 0.6s ease;
    }
    .cover.gone { opacity: 0; pointer-events: none; }
    .cover .k { font: 600 0.78rem/1 'Inter'; letter-spacing: 3px; text-transform: uppercase; color: var(--pink); }
    .cover h1 { font: 700 clamp(2.4rem, 11vw, 3.6rem)/1.05 'Dancing Script', cursive; }
    .cover p { max-width: 340px; color: rgba(255,255,255,0.75); font-size: 0.95rem; line-height: 1.5; }
    .big {
      margin-top: 8px; padding: 15px 30px; border: 0; border-radius: 999px; cursor: pointer;
      background: linear-gradient(135deg, #ff6b8a, #e8456b); color: #fff;
      font: 600 1.05rem/1 'Inter'; box-shadow: 0 10px 30px rgba(232,69,107,0.45);
    }
    .ghostbtn {
      padding: 12px 22px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: #fff;
      font: 500 0.92rem/1 'Inter'; text-decoration: none;
    }
    .cover .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    /* ── DIEU KHIEN ─────────────────────────────────────── */
    .hud {
      position: fixed; z-index: 25; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b));
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-radius: 999px;
      background: var(--glass); border: 1px solid var(--border);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
      max-width: 520px; margin: 0 auto;
    }
    .hud-on .hud { opacity: 1; pointer-events: auto; }
    .hud button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.12); color: #fff; font-size: 0.9rem; cursor: pointer; flex: none; }
    .hud .prog { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); overflow: hidden; }
    .hud .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff6b8a, #fde68a); }
    .hud .time { font: 500 0.72rem/1 'Inter'; color: rgba(255,255,255,0.75); min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; }
    .export .bar, .export .hud, .export .cover { display: none !important; }
  </style>
</head>

<script>
(() => {
  'use strict';

  // ★ LOI KE — sua thoai mai. Sua xong chay `npm run hoathinh` de xuat lai file MP4.
  //   art: canh ve (xem ART ben duoi)

  //   dur: so mili giay (bo trong = tu tinh theo do dai loi ke)
  const STORY = [
    { art: 'mo-dau', hero: true, date: '18.10.2025 — 18.10.2026', title: 'Chuyện của\nchúng mình',
      text: 'Ngày xửa ngày xưa, ở thành phố Huế, có một chàng trai và một cô gái…', dur: 7200 },
    { art: 'hien-mau', date: '24 · 08 · 2025', title: 'Lần đầu đi hiến máu', photos: ['24-08-25.jpg'],
      text: 'Lần đầu tiên hai đứa cùng đi hiến máu. Lúc ấy anh chưa biết, cô gái áo xanh đứng cạnh sẽ là cả thế giới của anh.' },
    { art: 'to-tinh', date: '18 · 10 · 2025', title: 'Ngày đầu yêu nhau',
      text: 'Rồi một ngày, em gật đầu. Từ hôm ấy, “anh” và “em” trở thành “chúng mình”.' },
    { art: 'sinh-nhat-em', date: '23 · 10 · 2025', title: 'Sinh nhật em', photos: ['anhsinhnhatemvsbanthan.jpg', '23-10-25-sinhnhatem.mp4'],

    { art: 'tram-ngay', date: '26 · 01 · 2026', title: 'Tròn 100 ngày', photos: ['100days.mp4'],

    { art: 'valentine', date: '14 · 02 · 2026', title: 'Valentine', photos: ['valentine-anhemratthich.jpg', 'valentine2.jpg', 'valentine3.jpg', '14-02-26.jpg'],

    { art: 'tet', date: '17 · 02 · 2026', title: 'Tết đầu tiên', photos: ['tet-am-lich-2026.mp4', 'phaohoagiaothua.mp4'],
      text: 'Giao thừa đầu tiên bên nhau. Pháo hoa nở rực trời, còn anh thì chỉ mải nhìn em.' },
    { art: 'di-choi', date: '04 — 05 · 2026', title: 'Những ngày bình thường', photos: ['dichoithang52026.jpg', 'anhemditructhang42026.jpg', 'emdethuongthang42026.mp4'],
      text: 'Có những ngày chẳng có dịp gì: đi trực, đi xem phim, đi dạo. Chỉ cần có em bên cạnh là đủ.' },
    { art: 'le-2-9', date: '02 · 09 · 2026', title: 'Lễ 2/9', photos: ['le2:9:3.jpg', 'le2:9:2.jpg', 'le2:9.jpg'],
      text: 'Lễ 2/9, hai đứa lên đồi thông, ngồi trên cỏ, ngắm trời xanh và kể nhau nghe đủ thứ chuyện.' },
    { art: 'hien-mau-2', date: '06 · 09 · 2026', title: 'Hiến máu lần 2', photos: ['hienmau-em-10lan-anh-15lan.jpg', 'emhienmau.jpg', 'emhienmau5.jpg', 'hienmau06-09-2026.jpg'],
      text: 'Một năm sau, mình lại cùng nhau đi hiến máu. Em đã 10 lần, anh 15 lần — gửi đi những giọt máu cho người cần.' },
    { art: 'sinh-nhat-anh', date: '09 · 10 · 2026', title: 'Sinh nhật anh', photos: ['quasinhnhatanh-dacbiet.jpg', 'anhngaysinhnhatanh.jpg', 'emngaysinhnhatanh.jpg', 'xemphimsinhnhatanh.jpg'],
      text: 'Sinh nhật anh, em chuẩn bị bánh kem, gấu bông và cả một buổi xem phim. Nhưng món quà lớn nhất vẫn là em.' },
    { art: 'ky-niem', date: '18 · 10 · 2026', title: 'Tròn 1 năm', photos: ['aodoidautiencuaanhvsem.jpg'],
      text: 'Tròn một năm. Hai đứa mặc chung áo đôi, và em hiến tóc lần 2 cho các chiến binh K — đúng ngày kỷ niệm.' },
    { art: 'ket', hero: true, date: '365 ngày · và còn nữa', title: 'Anh yêu em',
      text: 'Cảm ơn em vì một năm qua. Năm thứ hai, năm thứ ba, và thật nhiều năm nữa — mình viết tiếp nhé. ❤️', dur: 10500 },

  // Nhac phim (file MP4 cung dung bai nay)
  const SONG = 'music/love/yeu-em-hon-moi-ngay.mp3';

  const W = 540, H = 960;
  const FADE = 700;              // mo dan giua 2 canh
  const TYPE_MS = 34;            // moi chu hien sau bao lau
  const MEDIA = 'images/love/';
  const EXPORT = new URLSearchParams(location.search).has('xuat');

  // ── TIEN ICH ─────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  function S(tag, attrs = {}, kids = []) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    kids.forEach((c) => c && e.appendChild(c));
    return e;
  }
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const lerp = (a, b, p) => a + (b - a) * p;
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const eo = (p) => 1 - Math.pow(1 - p, 3);                       // easeOutCubic
  const eio = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const back = (p) => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  // so ngau nhien co dinh (lan nao ve cung giong nhau -> MP4 khong nhap nhay)
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const tf = (el, v) => el.setAttribute('transform', v);
  const op = (el, v) => el.setAttribute('opacity', v.toFixed(3));
  let gradN = 0;
  function grad(defs, stops, vertical = true) {
    const id = 'g' + (++gradN);
    defs.appendChild(S('linearGradient', vertical ? { id, x1: 0, y1: 0, x2: 0, y2: 1 } : { id, x1: 0, y1: 0, x2: 1, y2: 0 },
      stops.map(([o, c]) => S('stop', { offset: o, 'stop-color': c }))));
    return `url(#${id})`;
  }
  const HEART = 'M0,6 C-2,-2 -14,-4 -14,-12 C-14,-19 -6,-22 0,-15 C6,-22 14,-19 14,-12 C14,-4 2,-2 0,6Z';
  const DROP = 'M0,-14 C5,-6 9,-1 9,4 A9,9 0 1 1 -9,4 C-9,-1 -5,-6 0,-14Z';
  const heart = (fill, s = 1) => S('path', { d: HEART, fill, transform: `scale(${s})` });

  // ── NHAN VAT ─────────────────────────────────────────────────
  // Goc toa do o giua hai ban chan; cao ~240. Tay: 0 = buong thang, duong = gio ra ngoai,
  // am = dua vao trong (truoc nguoi).
  const SKIN = '#ffe1cc';
  function makeChar(who, o = {}) {
    const isAnh = who === 'anh';
    const c = isAnh

    // chan
    const leg = () => {

      g.appendChild(S('path', { d: 'M-30,-128 Q-34,-108 -31,-86 L31,-86 Q34,-108 30,-128 Q0,-137 -30,-128Z', fill: c.shirt, stroke: c.line, 'stroke-width': 2 }));

    g.append(armL, armR);
    // dau

    const blush = S('g', {}, [

    ]);
    head.appendChild(blush);
    const eye = (x) => S('g', { transform: `translate(${x},4)` }, [
      S('ellipse', { cx: 0, cy: 0, rx: 6.5, ry: 8.5, fill: '#2b1b18' }),

    ]);
    const eyeL = eye(-20), eyeR = eye(20);
    head.append(eyeL, eyeR);
    const smile = S('path', { d: 'M-8,26 Q0,33 8,26', fill: 'none', stroke: '#8a3b3b', 'stroke-width': 3, 'stroke-linecap': 'round' });

      // bim toc ben vai phai (chi khi toc dai)
      const braid = S('g');
      [0, 1, 2, 3, 4].forEach((k) => braid.appendChild(S('ellipse', { cx: 46 + (k % 2 ? 3 : -3), cy: 34 + k * 15, rx: 9, ry: 9.5, fill: c.hair })));

    const st = { who, g, hairLong, hairShort };
    // p: { x, y, s, armL, armR, legL, legR, bob, tilt, nod, blink, mouth:'open', blush, short }
    st.set = (p) => {
      const s = p.s || 1;
      tf(g, `translate(${p.x.toFixed(1)},${(p.y + (p.bob || 0)).toFixed(1)}) scale(${s})`);

  // chop mat moi ~3.4s, lech nhau giua 2 nguoi
  const blinkAt = (t, off = 0) => { const k = (t + off) % 3400; return k < 150 ? Math.sin((k / 150) * Math.PI) : 0; };
  // di bo: chan va tay dua nhip, nguoi nhun nhe
  const walk = (t, amp = 1) => {
    const w = Math.sin(t * 0.011);
    return { legL: 24 * w * amp, legR: -24 * w * amp, armL: 14 * w * amp, armR: -14 * w * amp, bob: -Math.abs(Math.cos(t * 0.011)) * 5 * amp };
  };

  // ── PHONG NEN DUNG CHUNG ─────────────────────────────────────
  function sky(svg, defs, top, bottom) { svg.appendChild(S('rect', { width: W, height: H, fill: grad(defs, [[0, top], [1, bottom]]) })); }
  function stars(svg, n, maxY = 620) {
    const list = [];
    for (let i = 0; i < n; i++) {
      const s = S('circle', { cx: rnd() * W, cy: rnd() * maxY, r: 0.8 + rnd() * 1.8, fill: '#fff' });
      s.ph = rnd() * 6.28; svg.appendChild(s); list.push(s);
    }
    return (t) => list.forEach((s) => op(s, 0.35 + 0.65 * Math.abs(Math.sin(t * 0.0018 + s.ph))));
  }
  function ground(svg, fill, d = 'M0,640 Q270,600 540,640 L540,960 L0,960Z') { svg.appendChild(S('path', { d, fill })); }
  function cloud(x, y, s = 1, fill = '#fff') {
    return S('g', { transform: `translate(${x},${y}) scale(${s})`, opacity: 0.95 }, [
      S('ellipse', { cx: 0, cy: 0, rx: 46, ry: 22, fill }), S('circle', { cx: -18, cy: -14, r: 22, fill }), S('circle', { cx: 14, cy: -20, r: 26, fill })]);
  }
  function sun(x, y, r = 40) {
    return S('g', {}, [S('circle', { cx: x, cy: y, r: r * 1.6, fill: '#fff6c9', opacity: 0.45 }), S('circle', { cx: x, cy: y, r, fill: '#ffd95a' })]);
  }
  function tree(x, y, s = 1) {
    return S('g', { transform: `translate(${x},${y}) scale(${s})` }, [
      S('rect', { x: -9, y: -70, width: 18, height: 72, rx: 6, fill: '#8a5a3c' }),
      S('circle', { cx: 0, cy: -100, r: 48, fill: '#58b368' }), S('circle', { cx: -34, cy: -78, r: 32, fill: '#4ea35d' }),
      S('circle', { cx: 34, cy: -80, r: 34, fill: '#63c072' })]);
  }
  function pine(x, y, s = 1, fill = '#2f7d4f') {
    return S('g', { transform: `translate(${x},${y}) scale(${s})` }, [
      S('rect', { x: -6, y: -20, width: 12, height: 22, fill: '#6b4430' }),
      S('path', { d: 'M0,-130 L34,-70 L18,-70 L44,-24 L-44,-24 L-18,-70 L-34,-70Z', fill })]);
  }
  function banner(year) {
    const g = S('g', { transform: 'translate(270,262)' }, [
      S('rect', { x: -168, y: -6, width: 8, height: 230, fill: '#8a5a3c' }), S('rect', { x: 160, y: -6, width: 8, height: 230, fill: '#8a5a3c' }),
      S('rect', { x: -165, y: -78, width: 330, height: 138, rx: 10, fill: '#d7263d', stroke: '#fff', 'stroke-width': 4 }),
      S('text', { x: 0, y: -46, 'text-anchor': 'middle', 'font-family': 'Inter, sans-serif', 'font-weight': 600, 'font-size': 15, fill: '#ffe3e8', 'letter-spacing': 1 }, [document.createTextNode('NGÀY HỘI HIẾN MÁU TÌNH NGUYỆN')]),
      S('text', { x: 0, y: 0, 'text-anchor': 'middle', 'font-family': 'Playfair Display, serif', 'font-weight': 800, 'font-size': 40, fill: '#fff' }, [document.createTextNode('CHỦ NHẬT ĐỎ')]),
      S('text', { x: 0, y: 36, 'text-anchor': 'middle', 'font-family': 'Inter, sans-serif', 'font-weight': 600, 'font-size': 16, fill: '#ffd1d9' }, [document.createTextNode(`Thành phố Huế · ${year}`)]),
    ]);
    return g;
  }
  // nhung thu bay len roi mo dan (tim, giot mau...) — lap lai theo chu ky
  function floaters(parent, n, make, area) {
    const list = [];
    for (let i = 0; i < n; i++) {
      const e = make(i); e.p = { x: area.x + rnd() * area.w, y0: area.y, off: rnd(), sp: 0.7 + rnd() * 0.6, sw: 8 + rnd() * 14 };
      parent.appendChild(e); list.push(e);
    }
    return (t, on = 1) => list.forEach((e) => {
      const k = ((t * 0.00022 * e.p.sp) + e.p.off) % 1;
      tf(e, `translate(${(e.p.x + Math.sin(t * 0.002 + e.p.off * 9) * e.p.sw).toFixed(1)},${(e.p.y0 - k * area.h).toFixed(1)}) scale(${(0.6 + 0.6 * e.p.off).toFixed(2)})`);
      op(e, on * Math.sin(k * Math.PI) * 0.9);
    });
  }
  // phao hoa: chum hat bung ra tu tam roi roi xuong, mo dan
  function firework(parent, x, y, color, start, period) {
    const g = S('g'); parent.appendChild(g);
    const glow = S('circle', { cx: x, cy: y, r: 10, fill: color }); g.appendChild(glow);
    const ps = [];
    for (let i = 0; i < 64; i++) {
      const c = S('circle', { r: i % 2 ? 2.2 : 3.6, fill: i % 5 ? color : '#fff' });
      c.a = (i / 64) * Math.PI * 4 + (i % 2) * 0.1; c.k = i % 2 ? 0.62 : 1; g.appendChild(c); ps.push(c);
    }
    const core = S('circle', { r: 4, fill: '#fff' }); g.appendChild(core);
    return (t) => {
      const k = t - start; if (k < 0) { op(g, 0); return; }
      const p = (k % period) / 1500;
      if (p > 1) { op(g, 0); return; }
      op(g, 1);
      const r = eo(p) * 92;
      glow.setAttribute('r', (20 + r).toFixed(1)); op(glow, 0.22 * (1 - p));
      ps.forEach((c) => { c.setAttribute('cx', (x + Math.cos(c.a) * r * c.k).toFixed(1)); c.setAttribute('cy', (y + Math.sin(c.a) * r * c.k + p * p * 34).toFixed(1)); op(c, 1 - p); });
      core.setAttribute('cx', x); core.setAttribute('cy', y); op(core, Math.max(0, 1 - p * 4));
    };
  }

  // ── CAC CANH VE ──────────────────────────────────────────────
  // Moi canh: build(svg, defs, actors) -> update(t, dur). actors: nhom nhan vat + do vat,
  // tu dich sang trai khi anh polaroid hien ra.
  const ART = {
    'mo-dau'(svg, defs, actors) {
      sky(svg, defs, '#0d0b2e', '#3b1f5c');
      const tw = stars(svg, 70, 640);
      svg.appendChild(S('circle', { cx: 430, cy: 150, r: 60, fill: '#fff4c8', opacity: 0.18 }));

      const anh = makeChar('anh'), em = makeChar('em');
      const hz = S('g', {}, [heart('#ff6b8a', 1.6)]);
      actors.append(anh.g, em.g, hz);
      return (t) => {
        tw(t);
        const p = eo(seg(t, 300, 3200));
        const wa = t < 3200 ? walk(t, 1 - p * 0.6) : {};
        anh.set({ x: lerp(-90, 205, p), y: 668, s: 0.82, ...wa, blink: blinkAt(t) });
        em.set({ x: lerp(630, 335, p), y: 668, s: 0.82, ...(t < 3200 ? walk(t + 300, 1 - p * 0.6) : {}), blink: blinkAt(t, 900) });
        const h = back(seg(t, 3300, 4000));
        tf(hz, `translate(270,${(470 - 10 * Math.sin(t * 0.004)).toFixed(1)}) scale(${(h * (1 + 0.08 * Math.sin(t * 0.008))).toFixed(3)})`);
        op(hz, seg(t, 3300, 3500));
      };
    },

    'hien-mau'(svg, defs, actors, year = '2025') {
      sky(svg, defs, '#bfe4ff', '#fff3f6');
      svg.appendChild(sun(492, 196, 28));
      svg.appendChild(cloud(70, 190, 0.8));
      svg.appendChild(tree(-10, 640, 1.3));
      svg.appendChild(tree(560, 650, 1.1));
      svg.appendChild(banner(year));
      ground(svg, '#9fdc8a');
      const drops = S('g'); svg.appendChild(drops);
      const fl = floaters(drops, 9, (i) => S('g', {}, [i % 3 ? S('path', { d: DROP, fill: '#e63950' }) : heart('#ff6b8a', 0.9)]), { x: 140, y: 560, w: 260, h: 330 });
      const anh = makeChar('anh', { outfit: 'blood' }), em = makeChar('em', { outfit: 'blood' });
      actors.append(anh.g, em.g);
      return (t) => {
        fl(t, seg(t, 2400, 3200));
        const p = eo(seg(t, 200, 2400));
        anh.set({ x: lerp(-80, 200, p), y: 676, ...(t < 2400 ? walk(t, 1 - p * 0.5) : {}), blink: blinkAt(t), look: t > 2400 ? -1 : 0 });
        const wave = t > 2300 && t < 4200 ? 120 + 25 * Math.sin(t * 0.012) : 0;
        em.set({ x: 345, y: 676, armR: wave, blink: blinkAt(t, 1200), mouth: t > 2300 ? 'open' : '', blush: 0.5 + 0.3 * seg(t, 2600, 3400) });

    },

    'to-tinh'(svg, defs, actors) {
      sky(svg, defs, '#ffb199', '#7b4fa3');
      svg.appendChild(S('circle', { cx: 270, cy: 640, r: 110, fill: '#ffd27a', opacity: 0.9 }));
      svg.appendChild(S('circle', { cx: 270, cy: 640, r: 170, fill: '#ffd27a', opacity: 0.18 }));
      ground(svg, '#5a2d5e', 'M0,650 Q270,620 540,650 L540,960 L0,960Z');
      const burst = S('g'); svg.appendChild(burst);
      const bh = [];
      for (let i = 0; i < 16; i++) { const h = heart(['#ff6b8a', '#ffb3c6', '#fff'][i % 3], 0.8); h.a = rnd() * Math.PI - Math.PI; h.d = 80 + rnd() * 140; burst.appendChild(h); bh.push(h); }
      const anh = makeChar('anh'), em = makeChar('em');
      const bigH = S('g', {}, [heart('#ff3d68', 1.7)]);
      actors.append(anh.g, em.g, bigH);
      return (t) => {
        const A = { x: 190, y: 676, armL: -40, armR: -40, blink: blinkAt(t), mouth: t > 3600 ? 'open' : '' };
        anh.set(A);
        const hands = anh.hand(A, 'R');
        const fly = eio(seg(t, 2300, 3300));
        const hx = lerp(hands[0] - 10, 350, fly), hy = lerp(hands[1] - 6, 470, fly) - Math.sin(fly * Math.PI) * 60;
        const pop = seg(t, 3400, 3700);
        tf(bigH, `translate(${hx.toFixed(1)},${hy.toFixed(1)}) scale(${((1 + 0.1 * Math.sin(t * 0.01)) * (1 - pop)).toFixed(3)})`);
        const cheeks = seg(t, 2600, 3200);
        const nod = t > 3600 && t < 4800 ? Math.max(0, Math.sin((t - 3600) * 0.013)) * 9 : 0;
        em.set({ x: 345, y: 676, armL: -172 * cheeks, armR: -172 * cheeks, blink: blinkAt(t, 700), nod, blush: 0.5 + 0.45 * cheeks, mouth: t > 3600 ? 'open' : '' });
        bh.forEach((h) => {
          const q = eo(seg(t, 3500, 5200));
          tf(h, `translate(${(270 + Math.cos(h.a) * h.d * q).toFixed(1)},${(470 + Math.sin(h.a) * h.d * q).toFixed(1)}) scale(${(0.6 + q * 0.5).toFixed(2)})`);
          op(h, t < 3500 ? 0 : 1 - seg(t, 5600, 7000));
        });
      };
    },

    'sinh-nhat-em'(svg, defs, actors) {
      sky(svg, defs, '#ffe6d6', '#ffc3c9');
      for (let i = 0; i < 9; i++) svg.appendChild(S('circle', { cx: 40 + i * 58, cy: 520 + (i % 3) * 30, r: 18 + (i % 4) * 6, fill: '#fff', opacity: 0.25 }));
      svg.appendChild(S('path', { d: 'M0,190 Q270,250 540,190', fill: 'none', stroke: '#c98b6b', 'stroke-width': 2 }));
      ['#ff6b8a', '#ffd23f', '#5aa9e6', '#7ed37e', '#c38bff'].forEach((col, i, a) => {
        for (let k = 0; k < 2; k++) {
          const x = 30 + (i + k * a.length) * 50, y = 190 + 60 * (1 - Math.pow((x - 270) / 270, 2)) * 0.5 + 6;
          svg.appendChild(S('path', { d: `M${x - 16},${y - 4} L${x + 16},${y - 4} L${x},${y + 28}Z`, fill: col }));
        }
      });
      const balloons = S('g'); svg.appendChild(balloons);
      const bl = [[70, 300, '#ff6b8a'], [470, 280, '#5aa9e6'], [500, 360, '#ffd23f']].map(([x, y, f]) => {
        const b = S('g', {}, [S('path', { d: `M0,40 Q8,90 -4,140`, stroke: '#fff', fill: 'none', 'stroke-width': 1.5 }), S('ellipse', { cx: 0, cy: 0, rx: 30, ry: 38, fill: f }), S('ellipse', { cx: -9, cy: -12, rx: 7, ry: 11, fill: '#fff', opacity: 0.4 })]);
        b.p = [x, y]; balloons.appendChild(b); return b;
      });
      const anh = makeChar('anh'), em = makeChar('em', { hat: 'party' });
      actors.append(anh.g, em.g);
      // ban + banh
      const table = S('g', {}, [S('rect', { x: 120, y: 600, width: 300, height: 26, rx: 6, fill: '#ffffff' }), S('rect', { x: 120, y: 620, width: 300, height: 120, fill: '#f6b6c4' })]);

  $('startBtn').addEventListener('click', () => {
    $('startCover').classList.add('gone');
    document.body.classList.add('playing');
    audio.currentTime = 0;
    play(0);
  });
  $('againBtn').addEventListener('click', () => {
    $('endCover').classList.add('gone');
    document.body.classList.add('playing');
    audio.currentTime = 0;
    play(0);
  });
  document.querySelector('.wrap').addEventListener('click', () => {
    if (!document.body.classList.contains('playing')) return;
    if (!document.body.classList.contains('hud-on')) { showHud(!playing); return; }
    playing ? pause() : (play(), showHud());
  });
  $('play').addEventListener('click', () => (playing ? pause() : (play(), showHud())));
  $('next').addEventListener('click', () => { const i = sceneAt(now()); if (i < scenes.length - 1) seekTo(scenes[i + 1].start); showHud(!playing); });
  $('prev').addEventListener('click', () => {
    const t = now(), i = sceneAt(t);
    seekTo(t - scenes[i].start > 1500 || i === 0 ? scenes[i].start : scenes[i - 1].start);
    showHud(!playing);
  });
  document.addEventListener('keydown', (e) => {
    if (!document.body.classList.contains('playing')) return;
    if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === 'ArrowRight') $('next').click();
    else if (e.key === 'ArrowLeft') $('prev').click();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  // de thu tren may: animDebug.renderAt(ms)
  window.animDebug = { scenes, TOTAL, renderAt, seekTo };
})();
</script>
</body>
</html>
