<head>

  <!-- Ten trang, tieu de, anh xem truoc deu KHONG nhac toi mon qua: em mo link / thay dia chi cung khong lo bi mat -->
  <title>Món quà cuối cùng ✦ Thị Huyền ❤️ Hữu Phước</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;500;600&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose:   #ff6b8a;
      --rose2:  #ff4d73;
      --pink:   #ffb3c6;
      --gold:   #f5c842;
      --gold2:  #fde68a;
      --champ:  #f3d9a4;          /* vang sam panh: chu nho, vien */
      --white:  #fff;
      --mut:    rgba(255,255,255,0.6);
      --border: rgba(255,255,255,0.15);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    /* App man hinh chinh iPhone: KHONG dung viewport-fit=cover (iOS 26 tinh viewport thieu dung phan thanh trang
       thai -> dai nen o day khong ve duoc). Khong cover thi env() = 0 nhung noi dung van cham day man hinh ->
       nut / khung o day lui it nhat 34px (thanh home iPhone). */
    @media (display-mode: standalone) { :root { --safe-b: max(env(safe-area-inset-bottom, 0px), 34px); } }

    html, body { height: 100%; overflow: hidden; }
    /* Mau nen DAC: Safari iPhone lay mau nay to vung thanh trang thai va duoi day */
    html { background-color: #12060c; }
    body {
      background: radial-gradient(ellipse at 50% 46%, #46152e 0%, #240a1b 42%, #0b0308 100%);
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
      user-select: none; -webkit-user-select: none;
    }

    /* ── NEN: dom sang mo + bui sao (chi transform / opacity) ── */
    .bokeh { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .bokeh i {
      position: absolute; border-radius: 50%; opacity: var(--o, 0.5);
      background: radial-gradient(circle, rgba(255,222,170,0.55) 0%, rgba(255,170,200,0.16) 42%, rgba(255,170,200,0) 70%);
      animation: drift var(--t, 14s) ease-in-out infinite alternate;
    }
    @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(var(--dx), var(--dy)) scale(var(--s, 1.2)); } }
    .bokeh b {
      position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
      animation: tw var(--t, 3s) ease-in-out infinite; animation-delay: var(--dl, 0s);
    }
    @keyframes tw { 0%, 100% { opacity: 0.12; transform: scale(0.6); } 50% { opacity: 0.9; transform: scale(1); } }

    /* ── THANH TREN ─────────────────────────────────────── */
    .bar {
      position: fixed; z-index: 6;
      top: calc(12px + var(--safe-t)); left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .bar > * { pointer-events: auto; }
    .pill {
      height: 40px; min-width: 40px; padding: 0 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(26,10,20,0.8);     /* khong backdrop-filter */
      color: rgba(255,255,255,0.85);
      font: 500 0.82rem/1 'Inter', sans-serif;
      text-decoration: none; cursor: pointer;
    }
    .pill:hover { background: rgba(255,77,115,0.25); border-color: rgba(255,107,138,0.5); }
    .pill.icon { width: 40px; padding: 0; font-size: 1rem; }
    .pill.on { border-color: rgba(255,107,138,0.5); }

    /* ── SAN KHAU ───────────────────────────────────────── */
    .stage {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center;
      padding: calc(66px + var(--safe-t)) 16px calc(16px + var(--safe-b));
    }
    .head { position: relative; flex: none; width: 100%; max-width: 520px; min-height: 108px; text-align: center; }
    .head > div { position: absolute; left: 0; right: 0; top: 0; transition: opacity 0.9s ease, transform 0.9s cubic-bezier(.2,.8,.2,1); }
    .h-show { opacity: 0; transform: translateY(14px); }
    .named .h-intro { opacity: 0; transform: translateY(-10px); }
    .named .h-show { opacity: 1; transform: none; }
    .kicker { font: 600 0.68rem/1.4 'Inter', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; color: var(--champ); opacity: 0.88; }
    .t-intro {
      margin-top: 8px;
      font: 700 clamp(2.4rem, 11.5vw, 3.3rem)/1.05 'Dancing Script', cursive;
      color: #ffe3ea; text-shadow: 0 0 24px rgba(255,107,138,0.45);
    }
    .t-name {
      margin-top: 8px;
      font: 700 clamp(2rem, 9.6vw, 2.9rem)/1.12 'Playfair Display', serif;
      background: linear-gradient(100deg, #e9eef6 0%, #ffffff 24%, #b4bfd2 50%, #ffffff 70%, #a6b1c4 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .t-name .tw { -webkit-text-fill-color: #f2f5fb; color: #f2f5fb; font-size: 0.5em; vertical-align: 0.9em; display: inline-block; animation: tw 2.4s ease-in-out infinite; }
    .t-sub { margin-top: 4px; font: italic 400 1rem/1.4 'Playfair Display', serif; color: rgba(255,230,236,0.82); }

    .scene { position: relative; flex: 1 1 auto; width: 100%; max-width: 560px; min-height: 230px; }
    .scene canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; transform: translateY(70px) scale(0.45);
      touch-action: none; cursor: grab;
    }
    .revealed .scene canvas { opacity: 1; transform: none; transition: opacity 1.1s ease, transform 1.7s cubic-bezier(.16,1,.3,1); }
    .halo {
      position: absolute; left: 50%; top: var(--by, 44%); width: min(94vw, 460px); aspect-ratio: 1.35;
      transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
      background: radial-gradient(ellipse, rgba(255,190,150,0.3) 0%, rgba(255,107,138,0.13) 38%, rgba(255,107,138,0) 70%);
    }
    /* tia sang tu trong hop: lop tinh xoay cham (transform), chi chay khi da mo hop */
    .rays-wrap {
      position: absolute; left: 50%; top: var(--by, 45%); width: min(150vw, 680px); aspect-ratio: 1;
      transform: translate(-50%, -50%) scale(0.2); opacity: 0; pointer-events: none;
    }
    .opening .rays-wrap { opacity: 0.95; transform: translate(-50%, -50%) scale(1); transition: opacity 1s ease 0.55s, transform 1.8s cubic-bezier(.16,1,.3,1) 0.55s; }
    .settled .rays-wrap { opacity: 0.4; transition: opacity 2.6s ease; }
    .rays {
      width: 100%; height: 100%; border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(255,240,236,0) 0deg 7deg, rgba(255,240,236,0.2) 10deg 12deg, rgba(255,240,236,0) 15deg 22deg);
      -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,0.55) 30%, transparent 66%);
              mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,0.55) 30%, transparent 66%);
      animation: spin 70s linear infinite; animation-play-state: paused;
    }
    .opening .rays { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── HOP QUA ────────────────────────────────────────── */
    .box {
      position: absolute; left: 50%; top: var(--by, 47%); z-index: 3;
      width: var(--bw, 170px); height: calc(var(--bw, 170px) * 0.92);
      transform: translate(-50%, -50%); cursor: pointer; outline: none;
    }
    .box[hidden] { display: none; }
    .box-glow {
      position: absolute; left: 50%; top: 52%; width: 250%; aspect-ratio: 1; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(255,240,232,0.55) 0%, rgba(255,140,175,0.17) 36%, rgba(255,140,175,0) 66%);
      transform: translate(-50%, -50%) scale(var(--g, 0.8)); opacity: var(--go, 0.5);
      transition: transform 0.5s cubic-bezier(.2,.8,.2,1), opacity 0.5s ease;
    }
    .box-shadow {
      position: absolute; left: 12%; right: 12%; bottom: -13%; height: 13%; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,0,0,0.6), rgba(0,0,0,0) 70%);
      animation: bobS 3.2s ease-in-out infinite;
    }
    @keyframes bobS { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(0.85); opacity: 0.55; } }
    .box-float { position: absolute; inset: 0; animation: bob 3.2s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-10px) rotate(1.2deg); } }
    .box-shake { position: absolute; inset: 0; }
    .box.tap1 .box-shake { animation: wig1 0.5s ease; }
    .box.tap2 .box-shake { animation: wig2 0.6s ease; }
    .box.nope .box-shake { animation: nope 0.5s ease; }
    @keyframes wig1 { 15% { transform: rotate(-6deg) scale(1.04); } 35% { transform: rotate(5deg) scale(1.04); } 55% { transform: rotate(-3deg); } 75% { transform: rotate(2deg); } }
    @keyframes wig2 { 12% { transform: translateY(-16px) rotate(-8deg) scale(1.07); } 30% { transform: translateY(-10px) rotate(7deg) scale(1.07); } 48% { transform: translateY(-4px) rotate(-6deg); } 66% { transform: rotate(4deg); } 84% { transform: rotate(-2deg); } }
    @keyframes nope { 20% { transform: translateX(-8px) rotate(-3deg); } 40% { transform: translateX(7px) rotate(3deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }

    .box-body {
      position: absolute; left: 5%; right: 5%; top: 31%; bottom: 0; overflow: hidden;
      border-radius: 10px 10px 16px 16px;
      background: linear-gradient(150deg, #ffffff 0%, #f3f1ec 45%, #d6d1c7 100%);
      box-shadow: inset 0 -14px 22px rgba(60,40,50,0.18), inset 0 2px 0 rgba(255,255,255,0.9), 0 22px 36px rgba(0,0,0,0.45);
    }
    .box-body::before, .box-lid::before {      /* ruy bang doc */
      content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 17%; transform: translateX(-50%);
      background: linear-gradient(90deg, #0f1733, #33457a 30%, #1f2d58 52%, #4a5f99 64%, #111a38);
    }
    .box-body::after {                           /* vet sang xien tren nhung */
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 28%, rgba(255,255,255,0.14) 40%, transparent 52%);
    }
    .rib-h {                                      /* ruy bang ngang */
      position: absolute; left: 0; right: 0; top: 40%; height: 15%;
      background: linear-gradient(180deg, #0f1733, #33457a 30%, #1f2d58 52%, #4a5f99 64%, #111a38);
    }
    .box-lid {
      position: absolute; left: 0; right: 0; top: 18%; height: 17%; overflow: hidden;
      border-radius: 9px;
      background: linear-gradient(180deg, #ffffff 0%, #f1eee8 60%, #dad5cc 100%);
      box-shadow: 0 8px 12px rgba(0,0,0,0.28), inset 0 2px 0 rgba(255,255,255,0.9), inset 0 -2px 0 rgba(150,140,130,0.35);
    }
    .bow { position: absolute; left: 50%; top: -6%; width: 66%; transform: translateX(-50%); transform-origin: 50% 70%; }
    .bow svg { display: block; width: 100%; height: auto; overflow: visible; }
    .lock {
      position: absolute; left: 50%; top: 58%; width: 24px; height: 24px; border-radius: 50%;
      transform: translate(-50%, -50%); display: none; place-items: center;
      background: #fff; border: 1.5px solid #233263; font-size: 11px; line-height: 1;
    }
    .locked .lock { display: grid; }

    /* mo hop: no bay, nap bay, than hop chim xuong. Moi transform deu viet day du (no can giu translateX(-50%)) */
    .box.open .box-float, .box.open .box-shadow { animation: none; }
    .box.open .bow { transform: translateX(-50%) translate(-34%, -240%) rotate(-38deg) scale(0.8); opacity: 0; transition: transform 0.9s cubic-bezier(.3,.6,.3,1), opacity 0.7s ease 0.25s; }
    .box.open .lock { display: none; }
    .box.open .box-lid { transform: translate(38%, -330%) rotate(28deg); opacity: 0; transition: transform 1s cubic-bezier(.3,.7,.2,1) 0.25s, opacity 0.6s ease 0.6s; }
    .box.open .box-body { transform: translateY(45%) scale(0.9); opacity: 0; transition: transform 1s ease 0.95s, opacity 0.8s ease 1.05s; }
    .box.open .box-shadow { opacity: 0; transition: opacity 0.6s ease 0.9s; }
    .box.open .box-glow { --g: 1.6; --go: 0; transition: transform 0.7s ease 0.3s, opacity 1.6s ease 0.9s; }

    .burst { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
    .spk {
      position: absolute; left: var(--x); top: var(--y); z-index: 4;
      font-size: var(--fs, 14px); line-height: 1; font-style: normal; color: var(--c, #fff); pointer-events: none;
      animation: spk var(--t, 1.3s) cubic-bezier(.15,.7,.3,1) forwards;
    }
    @keyframes spk {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(0deg); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--s, 1)) rotate(var(--r, 90deg)); opacity: 0; }
    }
    .flash {
      position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255,248,230,0.95), rgba(255,220,200,0.45) 38%, rgba(255,220,200,0) 72%);
    }
    .flash.go { animation: flash 1.2s ease-out; }
    @keyframes flash { 0% { opacity: 0; } 16% { opacity: 1; } 100% { opacity: 0; } }

    /* ── CHAN TRANG ─────────────────────────────────────── */
    .foot { position: relative; flex: none; width: 100%; max-width: 520px; min-height: 112px; text-align: center; transition: opacity 0.4s ease; }
    .foot > div { position: absolute; left: 0; right: 0; top: 0; }
    .hint { font: 500 0.92rem/1.45 'Inter', sans-serif; color: rgba(255,230,236,0.8); animation: hintBeat 2.4s ease-in-out infinite; }
    @keyframes hintBeat { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .cd { display: block; margin-top: 6px; font: 600 0.8rem/1.4 'Inter', sans-serif; color: var(--champ); letter-spacing: 0.04em; }
    .f-intro { transition: opacity 0.6s ease; }
    .revealed .f-intro { opacity: 0; pointer-events: none; }
    .f-show { opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.2,.8,.2,1); }
    .settled .f-show { opacity: 1; transform: none; pointer-events: auto; }
    .tip { font: 400 0.8rem/1.4 'Inter', sans-serif; color: rgba(255,230,236,0.7); }
    .tip.first { font-weight: 600; font-size: 0.86rem; color: var(--gold2); animation: hintBeat 2s ease-in-out infinite; }
    .prog { margin-top: 2px; font: 500 0.78rem/1.4 'Inter', sans-serif; color: var(--mut); }
    .prog b { color: var(--gold2); font-weight: 600; }
    .f-show .btn { margin-top: 10px; }
    .card-on .foot { opacity: 0; pointer-events: none; }
    .card-on .foot * { pointer-events: none !important; }

    .btn {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 48px; padding: 0 24px; border-radius: 999px; border: none;
      font: 600 0.95rem/1.2 'Inter', sans-serif; color: #3a1608; text-decoration: none; cursor: pointer;
      background: linear-gradient(135deg, #fff1c9 0%, #f5c842 45%, #e7a93a 100%);
      box-shadow: 0 10px 26px rgba(245,200,66,0.28), inset 0 1px 0 rgba(255,255,255,0.7);
    }
    .btn.ghost { background: rgba(255,255,255,0.07); color: #fff; border: 1px solid rgba(255,255,255,0.22); box-shadow: none; }
    .btn.pulse::after {
      content: ''; position: absolute; inset: -2px; border-radius: inherit; border: 2px solid var(--gold);
      animation: ping 1.8s ease-out infinite; pointer-events: none;
    }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.16, 1.5); opacity: 0; } }

    /* ── THE KY NIEM (cham mot vien da) ─────────────────── */
    .card {
      position: fixed; z-index: 7; left: 50%; bottom: calc(14px + var(--safe-b));
      width: min(calc(100vw - 24px), 460px);
      display: flex; gap: 14px; align-items: center;
      padding: 14px 40px 26px 14px; border-radius: 22px;
      background: linear-gradient(160deg, rgba(62,22,43,0.98), rgba(30,10,22,0.98));
      border: 1px solid rgba(243,217,164,0.3);
      box-shadow: 0 20px 50px rgba(0,0,0,0.55);
      transform: translate(-50%, calc(100% + 40px)); visibility: hidden;
      transition: transform 0.5s cubic-bezier(.2,.8,.2,1), visibility 0.5s;
    }
    .card.show { transform: translate(-50%, 0); visibility: visible; }
    .card .ph {
      flex: none; width: 92px; height: 112px; border-radius: 10px; overflow: hidden;
      display: grid; place-items: center; font-size: 2.6rem;
      background: linear-gradient(160deg, #5a1f3b, #2a0f1d);
      box-shadow: 0 0 0 3px #fffaf2, 0 8px 18px rgba(0,0,0,0.45);
      transform: rotate(-3deg);
    }
    .card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .tx { flex: 1; min-width: 0; text-align: left; }
    .card .dt { font: 600 0.66rem/1.3 'Inter', sans-serif; letter-spacing: 0.2em; color: var(--champ); }
    .card h3 { margin-top: 5px; font: 700 1.16rem/1.2 'Playfair Display', serif; color: #fff; }
    .card p { margin-top: 6px; font: 400 0.86rem/1.45 'Inter', sans-serif; color: rgba(255,235,240,0.88); }
    .card .x {
      position: absolute; top: 4px; right: 4px; width: 38px; height: 38px;
      border: 0; background: none; color: rgba(255,255,255,0.6); font-size: 1.4rem; line-height: 1; cursor: pointer;
    }
    .card .n { position: absolute; right: 6px; bottom: 4px; padding: 6px 8px; border: 0; background: none; font: 600 0.7rem/1 'Inter', sans-serif; color: var(--gold2); cursor: pointer; }

    /* ── LA THU ─────────────────────────────────────────── */
    .letter {
      position: fixed; inset: 0; z-index: 9;
      display: flex; align-items: center; justify-content: center;
      padding: calc(16px + var(--safe-t)) 14px calc(16px + var(--safe-b));
      background: rgba(12,4,9,0.9);
      opacity: 0; visibility: hidden; transition: opacity 0.6s ease, visibility 0.6s;
    }
    .letter.show { opacity: 1; visibility: visible; }
    .paper {
      position: relative; width: min(100%, 440px); max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 30px 24px 22px; border-radius: 6px;
      background: linear-gradient(180deg, #fffaf2 0%, #fbefdc 100%);
      color: #3d1622; box-shadow: 0 30px 70px rgba(0,0,0,0.6);
      transform: translateY(30px) scale(0.96); transition: transform 0.8s cubic-bezier(.2,.8,.2,1);
      user-select: text; -webkit-user-select: text;
    }
    .letter.show .paper { transform: none; }
    .paper .x {
      position: absolute; top: 6px; right: 6px; width: 38px; height: 38px;
      border: 0; background: none; color: rgba(61,22,34,0.5); font-size: 1.4rem; cursor: pointer;
    }
    .paper .orn { text-align: center; font-size: 0.7rem; letter-spacing: 0.6em; color: #c8922e; }
    .paper .ln { opacity: 0; transform: translateY(8px); }
    .letter.show .paper .ln { animation: lnIn 0.9s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d); }
    @keyframes lnIn { to { opacity: 1; transform: none; } }
    .paper .greet { margin-top: 12px; font: 700 1.55rem/1.25 'Dancing Script', cursive; color: #8a2a43; }
    .paper p { margin-top: 12px; font: 400 0.98rem/1.65 'Inter', sans-serif; color: #3d1622; }
    .paper .sign { margin-top: 16px; text-align: right; font: 700 1.5rem/1.2 'Dancing Script', cursive; color: #8a2a43; }
    .paper .pola { width: 72%; margin: 6px auto 4px; padding: 8px 8px 26px; background: #fff; box-shadow: 0 8px 22px rgba(61,22,34,0.25); transform: rotate(-2deg); }
    .paper .pola img { display: block; width: 100%; height: auto; }
    .paper .acts { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .paper .btn.ghost { color: #8a2a43; border-color: rgba(138,42,67,0.3); background: transparent; }

    /* ── KHOANH KHAC DEO VONG ───────────────────────────── */
    .finale {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;

  // ── NHAC NEN + CHUONG ───────────────────────────────────────────────────────
  const PLAYLIST = LoveMusic.forPage('mon-qua-cuoi');   // ngau nhien trong ca danh sach (js/love-music.js)
  const musicEl = $('music');

    const t0 = performance.now();

  musicEl.addEventListener('click', () => {
    const on = !musicOn; userOff = !on;

  document.addEventListener('visibilitychange', () => {

      if (actx.state === 'suspended') actx.resume();
      const t0 = actx.currentTime + 0.02;
      notes.forEach((f, i) => {
        const t = t0 + i * gap;

          o.type = 'sine'; o.frequency.value = f * m;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol * v, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur * d);

    return d ? `còn ${d} ngày ${h} giờ ${pad2(m)} phút` : h ? `còn ${h} giờ ${pad2(m)} phút ${pad2(s)} giây` : `còn ${m} phút ${pad2(s)} giây`;

  function restartClass(el, cls) { el.classList.remove('tap1', 'tap2', 'nope'); void el.offsetWidth; el.classList.add(cls); }

  boxEl.addEventListener('click', (e) => { e.stopPropagation(); tapBox(); });
  boxEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapBox(); } });
  scene.addEventListener('click', () => { if (!opening && !boxEl.hidden) tapBox(); });   // hop nho: cham quanh hop cung tinh

  function openBox(bx0, by0) {

  // ═══ CHIEC VONG 3D (canvas) ═══════════════════════════════════════════════
  // Ve theo mau that Hapas Musee Tennis (ma bach kim): nua duoi la hang da CZ tron gan chau vuong, hai ben la
  // day hop (box chain) chay len nut truot oval o dinh, hai duoi day thong xuong co bi bac o dau.
  // Vong nghieng TILT, quay quanh truc cua no; chieu phoi canh roi nghieng ca vong ROLL tren man hinh.
  // Ve bang sprite ve san (drawImage), sap xep sau -> truoc moi khung. Dung yen thi dua nhe quanh goc dep nhat.
  const bv = $('bv'), g2 = bv.getContext('2d');
  const TILT = 0.6, SIN_T = Math.sin(TILT), COS_T = Math.cos(TILT);
  const ROLL = -0.1, SIN_R = Math.sin(ROLL), COS_R = Math.cos(ROLL);
  const A_SPEC = 1.2;                                   // goc phan chieu anh sang (hoi lech phai phia truoc)
  const SWAY = reduceMotion ? 0.18 : 0.5;               // bien do dua nhe khi khong ai cham
  const TH_C = Math.PI / 2, STONE_ARC = 3.5, NS = 34;   // hang da: giua phia truoc, 34 vien
  const TH_S = TH_C + Math.PI, CHAIN_ARC = TAU - STONE_ARC, NL = 84;   // nut truot o dinh; 84 mat day hop
  const STONE = 15, LINK_W = 6.6, LINK_H = 5.4, SL_W = 26, SL_H = 15, BALL = 8.5, TAIL_STEP = 5;   // don vi u
  let BW = 0, BH = 0, DPR = 1, R = 120, u = 0.8, CX = 0, CY = 0, CY0 = 0, FOC = 500, SP = 2;

  const LV = [0.42, 0.54, 0.66, 0.78, 0.9, 1];
  const lvIdx = (b) => { let k = 0; for (let i = 1; i < LV.length; i++) if (Math.abs(LV[i] - b) < Math.abs(LV[k] - b)) k = i; return k; };
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
  const upright = (a) => (a > Math.PI / 2 ? a - Math.PI : a < -Math.PI / 2 ? a + Math.PI : a);   // vet sang luon o phia tren
  function darken(g, W, H, level) {
    if (level > 0.999) return;
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-atop'; g.fillStyle = `rgba(16,5,11,${(1 - level).toFixed(3)})`; g.fillRect(0, 0, W, H);
    g.restore();
  }
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  const platinum = (g, x0, y0, x1, y1) => {             // bach kim: bac hoi lanh
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.25, '#dfe4ec'); gr.addColorStop(0.5, '#9ea6b3'); gr.addColorStop(0.72, '#f2f4f8'); gr.addColorStop(1, '#7f8794');
    return gr;
  };

  /** Mat day hop (box chain): hop vuong nho, lo toi o giua */
  function linkSprite(level) {
    const w = LINK_W * u, h = LINK_H * u, W = Math.ceil(w * SP), H = Math.ceil(h * SP), c = mk(W, H), g = c.getContext('2d');
    const r = Math.min(W, H) * 0.18;
    rr(g, 0.5, 0.5, W - 1, H - 1, r);
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#f6f8fb'); gr.addColorStop(0.35, '#ffffff'); gr.addColorStop(0.62, '#b9c0cb'); gr.addColorStop(1, '#858c99');
    g.fillStyle = gr; g.fill();
    g.strokeStyle = 'rgba(80,86,98,0.45)'; g.lineWidth = Math.max(1, SP * 0.3); g.stroke();
    rr(g, W * 0.32, H * 0.32, W * 0.36, H * 0.36, r * 0.5); g.fillStyle = 'rgba(70,78,92,0.32)'; g.fill();
    darken(g, W, H, level);
    return { cv: c, w, h };
  }
  /** Mot vien da CZ tron trong chau vuong 4 chau (front) / mat sau cua chau (back) */
  function stoneSprite(level, front) {
    const s = STONE * u, S = Math.ceil(s * SP), c = mk(S, S), g = c.getContext('2d'), m = S / 2;
    rr(g, S * 0.04, S * 0.04, S * 0.92, S * 0.92, S * 0.2);
    g.fillStyle = platinum(g, 0, 0, S, S); g.fill();
    g.strokeStyle = 'rgba(70,76,88,0.55)'; g.lineWidth = Math.max(1, S * 0.03); g.stroke();
    if (front) {
      g.beginPath(); g.arc(m, m, S * 0.43, 0, TAU); g.fillStyle = '#596170'; g.fill();          // o dat da
      const r = S * 0.39;
      g.save(); g.beginPath(); g.arc(m, m, r, 0, TAU); g.clip();
      let gr = g.createRadialGradient(m - r * 0.25, m - r * 0.3, r * 0.05, m, m, r);
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.45, '#eef2f7'); gr.addColorStop(0.8, '#b8c2cf'); gr.addColorStop(1, '#8792a1');
      g.fillStyle = gr; g.fillRect(0, 0, S, S);
      for (let i = 0; i < 16; i++) {                                                             // mat cat hinh sao
        const a0 = (i / 16) * TAU, a1 = ((i + 1) / 16) * TAU;
        g.beginPath();
        g.moveTo(m + Math.cos(a0) * r * 0.42, m + Math.sin(a0) * r * 0.42);
        g.lineTo(m + Math.cos(a0) * r * 1.05, m + Math.sin(a0) * r * 1.05);
        g.lineTo(m + Math.cos(a1) * r * 1.05, m + Math.sin(a1) * r * 1.05);
        g.closePath();
        g.fillStyle = i % 2 ? 'rgba(255,255,255,0.5)' : 'rgba(80,92,110,0.28)'; g.fill();
      }
      g.beginPath();                                                                             // mat ban bat giac
      for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU + TAU / 16, x = m + Math.cos(a) * r * 0.46, y = m + Math.sin(a) * r * 0.46; i ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.closePath(); g.fillStyle = 'rgba(255,255,255,0.35)'; g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = Math.max(0.6, S * 0.012); g.stroke();
      for (const [dx, dy, col] of [[-0.3, 0.2, 'rgba(255,120,170,0.55)'], [0.28, -0.1, 'rgba(120,190,255,0.55)'], [0.05, 0.35, 'rgba(255,230,120,0.5)'], [-0.15, -0.32, 'rgba(160,255,210,0.4)']]) {
        g.beginPath(); g.arc(m + dx * r, m + dy * r, r * 0.11, 0, TAU); g.fillStyle = col; g.fill();   // lua tan sac cua CZ
      }
      gr = g.createRadialGradient(m - r * 0.35, m - r * 0.4, 0, m - r * 0.35, m - r * 0.4, r * 0.55);
      gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, S, S);
      g.restore();
      for (const a of [0.785, 2.356, 3.927, 5.498]) {                                              // 4 chau giu da
        const x = m + Math.cos(a) * S * 0.4, y = m + Math.sin(a) * S * 0.4, pr = S * 0.085;
        const pg = g.createRadialGradient(x - pr * 0.3, y - pr * 0.3, 0, x, y, pr);
        pg.addColorStop(0, '#ffffff'); pg.addColorStop(0.6, '#c3cad5'); pg.addColorStop(1, '#6d7480');
        g.beginPath(); g.arc(x, y, pr, 0, TAU); g.fillStyle = pg; g.fill();
      }
    } else {
      g.beginPath(); g.arc(m, m, S * 0.14, 0, TAU); g.fillStyle = '#7a8291'; g.fill();             // lo nho sau chau
    }
    darken(g, S, S, front ? level : Math.min(1, level + 0.12));   // mat sau chau bac: sang nhu kim loai
    return { cv: c, w: s, h: s };
  }
  /** Nut truot oval (bolo) o dinh vong */
  function sliderSprite(level, front) {
    const w = SL_W * u, h = SL_H * u, W = Math.ceil(w * SP), H = Math.ceil(h * SP), c = mk(W, H), g = c.getContext('2d');
    const cx = W / 2, cy = H / 2, oval = (kx, ky) => { g.beginPath(); g.ellipse(cx, cy, W * kx, H * ky, 0, 0, TAU); };
    oval(0.48, 0.46); g.fillStyle = platinum(g, 0, 0, W, H); g.fill();
    g.strokeStyle = 'rgba(70,76,88,0.6)'; g.lineWidth = Math.max(1, SP * 0.4); g.stroke();
    if (front) {
      g.save(); oval(0.36, 0.3); g.clip();
      const gr = g.createRadialGradient(cx - W * 0.1, cy - H * 0.1, 0, cx, cy, W * 0.36);
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.5, '#eef1f6'); gr.addColorStop(1, '#a9b3c1');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = Math.max(0.6, SP * 0.25);
      for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * W * 0.4, cy + Math.sin(a) * H * 0.34); g.stroke(); }
      g.restore();
      oval(0.36, 0.3); g.strokeStyle = 'rgba(90,96,108,0.7)'; g.lineWidth = Math.max(1, SP * 0.5); g.stroke();
    } else { oval(0.3, 0.2); g.fillStyle = 'rgba(70,76,88,0.35)'; g.fill(); }
    g.save(); oval(0.48, 0.46); g.clip();
    const sh = g.createLinearGradient(0, 0, 0, H); sh.addColorStop(0, 'rgba(255,255,255,0.5)'); sh.addColorStop(0.4, 'rgba(255,255,255,0)');
    g.fillStyle = sh; g.fillRect(0, 0, W, H * 0.5); g.restore();
    darken(g, W, H, level);
    return { cv: c, w, h };
  }
  function ballSprite(level) {
    const s = BALL * u, S = Math.ceil(s * SP), c = mk(S, S), g = c.getContext('2d'), m = S / 2;
    const gr = g.createRadialGradient(m * 0.7, m * 0.6, 0, m, m, m);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.4, '#dfe4ec'); gr.addColorStop(0.8, '#8d95a2'); gr.addColorStop(1, '#5d6470');
    g.beginPath(); g.arc(m, m, m - 0.5, 0, TAU); g.fillStyle = gr; g.fill();
    darken(g, S, S, level);
    return { cv: c, w: s, h: s };
  }
  function glintSprite() {
    const s = 40 * u, S = Math.ceil(s * SP), c = mk(S, S), g = c.getContext('2d'), m = S / 2;
    const gr = g.createRadialGradient(m, m, 0, m, m, m * 0.42);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(245,248,255,0.55)'); gr.addColorStop(1, 'rgba(235,240,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
    const ray = (len, wid, rot) => {
      g.save(); g.translate(m, m); g.rotate(rot);
      const lg = g.createLinearGradient(-len, 0, len, 0);
      lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,0.95)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = lg; g.beginPath(); g.moveTo(-len, 0); g.lineTo(0, -wid); g.lineTo(len, 0); g.lineTo(0, wid); g.closePath(); g.fill();
      g.restore();
    };
    ray(m, S * 0.035, 0); ray(m, S * 0.035, Math.PI / 2); ray(m * 0.5, S * 0.022, Math.PI / 4); ray(m * 0.5, S * 0.022, -Math.PI / 4);

  }
  function softSprite(stops, s) {

    const gr = g.createRadialGradient(m, m, 0, m, m, m);
    stops.forEach(([o, col]) => gr.addColorStop(o, col));
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
    return { cv: c, w: s, h: s };
  }

  let SPR = null;
  function makeSprites() {
    SP = DPR * 1.45;
    SPR = {
      link: LV.map(linkSprite), ball: LV.map(ballSprite),
      stoneF: LV.map((l) => stoneSprite(l, true)), stoneB: LV.map((l) => stoneSprite(l, false)),
      slF: LV.map((l) => sliderSprite(l, true)),
      glint: glintSprite(),
      glow: softSprite([[0, 'rgba(255,200,220,0.8)'], [0.35, 'rgba(255,120,160,0.32)'], [1, 'rgba(255,120,160,0)']], 46 * u),
      shadow: softSprite([[0, 'rgba(255,170,190,0.24)'], [0.5, 'rgba(255,107,138,0.08)'], [1, 'rgba(255,107,138,0)']], 100 * u),
    };
  }

  // Phan tu ve: day hop + hang da + nut truot + 2 duoi day. Moi ky niem gan mot doan da (trai -> phai theo thoi gian).
  const M = MEMORIES.length;
  const links = Array.from({ length: NL }, (_, i) => ({ t: 0, th: TH_C + STONE_ARC / 2 + ((i + 0.5) / NL) * CHAIN_ARC, x: 0, y: 0, p: 1, d: 0, sa: 0, a: 0, tx: 1, ty: 0, lv: 5, hide: false }));
  links.forEach((l) => { l.hide = Math.abs(wrapPi(l.th - TH_S)) < (SL_W * 0.42) / 150; });   // doan day nam trong nut truot
  const stones = Array.from({ length: NS }, (_, j) => ({
    t: 1, j, th: TH_C - STONE_ARC / 2 + ((j + 0.5) / NS) * STONE_ARC, mem: Math.min(M - 1, Math.floor(((NS - 1 - j) * M) / NS)),
    x: 0, y: 0, p: 1, d: 0, sa: 0, a: 0, tx: 1, ty: 0, lv: 5, twAt: 0, twNext: performance.now() + Math.random() * 6000,
  }));
  const memTh = MEMORIES.map((_, k) => { const s = stones.filter((st) => st.mem === k); return s.reduce((a, st) => a + st.th, 0) / s.length; });
  const slider = { t: 2, th: TH_S, x: 0, y: 0, p: 1, d: 0, sa: 0, a: 0, tx: 1, ty: 0, lv: 5 };
  const tails = [
    { t: 3, off: -0.3, n: 9, rest: 0.1, phi: 0.1, om: 0, px: null, pvx: 0, x: 0, y: 0, p: 1, d: 0, lv: 5 },
    { t: 3, off: 0.3, n: 7, rest: -0.12, phi: -0.12, om: 0, px: null, pvx: 0, x: 0, y: 0, p: 1, d: 0, lv: 5 },
  ];
  const items = [...links, ...stones, slider, ...tails];

  function geom(o, a) {
    const ca = Math.cos(a), sa = Math.sin(a);
    const d = R * sa * COS_T, p = FOC / (FOC - d);
    const x = R * ca * p, y = R * sa * SIN_T * p;
    o.x = CX + x * COS_R - y * SIN_R; o.y = CY + x * SIN_R + y * COS_R; o.p = p; o.d = d; o.sa = sa; o.a = a;
    const tx = -sa, ty = ca * SIN_T;                        // tiep tuyen tren man hinh (chua nhan phoi canh)
    o.tx = tx * COS_R - ty * SIN_R; o.ty = tx * SIN_R + ty * COS_R;
  }
  const shade = (sa, sp) => Math.min(1, 0.42 + 0.58 * Math.pow((sa + 1) / 2, 0.85) + 0.22 * sp);
  const shadeMetal = (sa, sp) => Math.min(1, 0.66 + 0.34 * ((sa + 1) / 2) + 0.2 * sp);   // day / nut / duoi: sang ca mat sau
  const spec = (a) => { const x = wrapPi(a - A_SPEC); return Math.exp(-(x * x) / 0.05); };

  function layout() {
    const r = scene.getBoundingClientRect();
    BW = r.width; BH = r.height; DPR = Math.min(2, window.devicePixelRatio || 1);
    bv.width = Math.round(BW * DPR); bv.height = Math.round(BH * DPR);
    R = Math.max(70, Math.min(BW / 2.22, BH / 1.72, 195));
    u = R / 150; CX = BW / 2; CY = CY0 = BH / 2 - 0.12 * R; FOC = 4.2 * R;
    scene.style.setProperty('--bw', Math.round(Math.max(130, Math.min(190, R * 1.15))) + 'px');
    scene.style.setProperty('--by', Math.round(CY0 + 0.12 * R) + 'px');
    makeSprites();
  }

  let rot = 0, rotV = 0, target = null, spinIn = null, dragging = false, raf = 0, last = 0, paused = false;
  let selK = -1;
  const rot0 = 0;                                     // hang da o giua phia truoc, nut truot o dinh (nhu anh san pham)

  function startBracelet() {
    if (raf) return;
    rot = rot0 - 4.6;
    spinIn = { t0: performance.now(), dur: reduceMotion ? 600 : 2600, from: rot0 - 4.6 };
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
  const easeOut = (q) => 1 - Math.pow(1 - q, 3);

  const glints = [];
  function drawStone(s, now) {
    const front = s.sa >= 0, base = STONE * u * s.p;
    const tl = Math.hypot(s.tx, s.ty), an = upright(Math.atan2(s.ty, s.tx)), co = Math.cos(an), sn = Math.sin(an);
    const w = base * Math.max(0.5, tl) * 1.06, h = base * (0.4 + 0.56 * Math.abs(s.sa));   // cac vien khit nhau ca o doan nghieng
    if (s.mem === selK) {
      const gl = SPR.glow, gs = gl.w * s.p * (0.95 + 0.08 * Math.sin(now / 260));
      g2.setTransform(DPR, 0, 0, DPR, 0, 0); g2.globalAlpha = 0.85;
      g2.drawImage(gl.cv, s.x - gs / 2, s.y - gs / 2, gs, gs); g2.globalAlpha = 1;
    }
    g2.setTransform(DPR * co, DPR * sn, -DPR * sn, DPR * co, DPR * s.x, DPR * s.y);
    const spr = (front ? SPR.stoneF : SPR.stoneB)[s.lv];
    g2.drawImage(spr.cv, -w / 2, -h / 2, w, h);
    if (s.sa > 0.05) {
      if (now > s.twNext) { s.twAt = now; s.twNext = now + 2500 + Math.random() * 7000; }
      const tw = clamp01(1 - Math.abs((now - s.twAt) / 260 - 1));
      const k = Math.max(spec(s.a) * (0.7 + 0.3 * Math.sin(now / 140 + s.j * 1.7)), tw * 0.9, s.mem === selK ? 0.35 + 0.25 * Math.sin(now / 300 + s.j) : 0);
      if (k > 0.22) glints.push([s.x - base * 0.12, s.y - base * 0.12, k * s.p]);
    }
  }
  function drawSlider(s) {
    const tl = Math.hypot(s.tx, s.ty), an = upright(Math.atan2(s.ty, s.tx)), co = Math.cos(an), sn = Math.sin(an);
    const w = SL_W * u * s.p * Math.max(0.35, tl), h = SL_H * u * s.p * (0.4 + 0.6 * Math.abs(s.sa));
    g2.setTransform(DPR * co, DPR * sn, -DPR * sn, DPR * co, DPR * s.x, DPR * s.y);
    const spr = SPR.slF[s.lv];                              // nut truot co da o ca hai mat: luon thay
    g2.drawImage(spr.cv, -w / 2, -h / 2, w, h);
    const k = Math.max(s.sa > 0.1 ? spec(s.a) : 0, 0.3 + 0.3 * Math.sin(performance.now() / 700));
    if (k > 0.45) glints.push([s.x, s.y - h * 0.1, k * s.p * 0.8]);
  }
  function drawTail(t) {
    const step = TAIL_STEP * u * t.p, ls = SPR.link[t.lv], w = ls.w * t.p, h = ls.h * t.p;
    const dx = -Math.sin(t.phi), dy = Math.cos(t.phi);
    const an = upright(Math.atan2(dy, dx)), co = Math.cos(an), sn = Math.sin(an);
    for (let i = 1; i <= t.n; i++) {
      g2.setTransform(DPR * co, DPR * sn, -DPR * sn, DPR * co, DPR * (t.x + dx * step * i), DPR * (t.y + dy * step * i));
      g2.drawImage(ls.cv, -w / 2, -h / 2, w, h);
    }
    const b = SPR.ball[t.lv], bs = b.w * t.p;
    g2.setTransform(DPR, 0, 0, DPR, 0, 0);
    g2.drawImage(b.cv, t.x + dx * step * (t.n + 1.1) - bs / 2, t.y + dy * step * (t.n + 1.1) - bs / 2, bs, bs);
  }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (paused) { last = now; return; }
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now;

    // ── quay: xoay vao -> keo tay -> quay toi ky niem dang xem -> quan tinh sau khi vuot -> dua nhe quanh goc dep
    if (spinIn) {
      const q = clamp01((now - spinIn.t0) / spinIn.dur);
      rot = spinIn.from + (rot0 - spinIn.from) * easeOut(q);
      if (q >= 1) { spinIn = null; rotV = 0; }
    } else if (dragging) {
      // rot doi trong pointermove
    } else if (target != null) {
      rot += wrapPi(target - rot) * Math.min(1, dt * 5); rotV = 0;
    } else if (Math.abs(rotV) > 0.12) {
      rot += rotV * dt; rotV *= Math.exp(-dt * 1.6);
    } else {
      rotV = 0;
      const home = rot0 + TAU * Math.round((rot - rot0) / TAU);
      rot += (home + SWAY * Math.sin(now / 1800) - rot) * Math.min(1, dt * 0.9);
    }
    CY = CY0 + Math.sin(now / 900) * 3 * u;              // lo lung nhe len xuong

    for (const l of links) { geom(l, l.th + rot); l.lv = lvIdx(shadeMetal(l.sa, l.sa > 0 ? spec(l.a) * 0.6 : 0)); }
    for (const s of stones) { geom(s, s.th + rot); s.lv = s.mem === selK ? 5 : lvIdx(shade(s.sa, s.sa > 0 ? spec(s.a) : 0)); }
    geom(slider, slider.th + rot); slider.lv = lvIdx(shadeMetal(slider.sa, 0.3)); slider.d += 0.07 * R;   // nut phu len doan day sat no
    for (const t of tails) {                              // duoi day lac nhu con lac khi vong quay
      t.p = slider.p; t.lv = slider.lv;
      const off = t.off * SL_W * u * slider.p;
      t.x = slider.x + slider.tx * off; t.y = slider.y + slider.ty * off;
      const vx = t.px == null ? 0 : (t.x - t.px) / dt, ax = t.px == null ? 0 : (vx - t.pvx) / dt;
      t.px = t.x; t.pvx = vx;
      const L = TAIL_STEP * u * t.n * 0.6;
      t.om += (-24 * Math.sin(t.phi - t.rest) + (Math.max(-4000, Math.min(4000, ax)) / L) * Math.cos(t.phi) * 0.05 - 1.5 * t.om) * dt;
      t.om = Math.max(-10, Math.min(10, t.om));
      t.phi = Math.max(-1.2, Math.min(1.2, t.phi + t.om * dt));
      t.d = slider.d + 0.3;
    }
    items.sort((A, B) => A.d - B.d);

    g2.setTransform(1, 0, 0, 1, 0, 0);
    g2.clearRect(0, 0, bv.width, bv.height);
    g2.setTransform(DPR, 0, 0, DPR, 0, 0);
    g2.drawImage(SPR.shadow.cv, CX - R * 1.05, CY0 + R * 0.86, R * 2.1, R * 0.32);
    glints.length = 0;
    for (const it of items) {
      if (it.t === 0) {
        if (it.hide) continue;
        const s = SPR.link[it.lv], w = s.w * it.p, h = s.h * it.p, an = upright(Math.atan2(it.ty, it.tx)), co = Math.cos(an), sn = Math.sin(an);
        g2.setTransform(DPR * co, DPR * sn, -DPR * sn, DPR * co, DPR * it.x, DPR * it.y);
        g2.drawImage(s.cv, -w / 2, -h / 2, w, h);
      } else if (it.t === 1) drawStone(it, now);
      else if (it.t === 2) drawSlider(it);
      else drawTail(it);
    }
    g2.setTransform(DPR, 0, 0, DPR, 0, 0);               // tia lap lanh (cong sang)
    g2.globalCompositeOperation = 'lighter';
    const gl = SPR.glint;
    for (const [x, y, k] of glints) {
      const s = gl.w * (0.3 + 0.6 * k);
      g2.globalAlpha = Math.min(1, k * 1.1);
      g2.drawImage(gl.cv, x - s / 2, y - s / 2, s, s);
    }
    g2.globalAlpha = 1; g2.globalCompositeOperation = 'source-over';
  }

  // ── keo de xoay, cham de xem ky niem ───────────────────────────────────────
  let downX = 0, downY = 0, lastX = 0, lastT = 0, moved = 0, dragV = 0;
  bv.addEventListener('pointerdown', (e) => {
    if (!stage.classList.contains('revealed')) return;
    dragging = true; moved = 0; downX = lastX = e.clientX; downY = e.clientY; lastT = performance.now(); dragV = 0;
    spinIn = null;
    try { bv.setPointerCapture(e.pointerId); } catch {}
  });
  bv.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, now = performance.now();
    moved = Math.max(moved, Math.hypot(e.clientX - downX, e.clientY - downY));
    lastX = e.clientX;
    if (moved < 6) return;
    target = null;
    const dr = -dx / (R * 1.05);
    rot += dr;
    dragV = dragV * 0.5 + 0.5 * (dr / Math.max(0.008, (now - lastT) / 1000));
    lastT = now;
  });
  const endDrag = (e, cancel) => {
    if (!dragging) return;
    dragging = false;
    if (cancel) return;
    if (moved < 8) { tapAt(e.clientX, e.clientY); return; }
    rotV = performance.now() - lastT > 120 ? 0 : Math.max(-9, Math.min(9, dragV));   // vuot nhanh: vong quay tiep roi cham dan
  };
  bv.addEventListener('pointerup', (e) => endDrag(e, false));
  bv.addEventListener('pointercancel', (e) => endDrag(e, true));

  function tapAt(clientX, clientY) {
    const r = bv.getBoundingClientRect(), x = clientX - r.left, y = clientY - r.top;
    let best = null, bestS = Infinity;
    for (const s of stones) {
      if (s.sa < -0.35) continue;                          // da o mat sau vong: bi che
      const d = Math.hypot(x - s.x, y - s.y);
      if (d > STONE * u * s.p * 0.75 + 8) continue;
      const sc = d - s.d * 0.05;                           // hai vien chong nhau: uu tien vien gan hon
      if (sc < bestS) { bestS = sc; best = s; }
    }
    if (best) { openCard(best.mem); return; }
    if (slider.sa > -0.35 && Math.hypot(x - slider.x, y - slider.y) < SL_W * u * slider.p * 0.7 + 8) {
      chime([SCALE[4], SCALE[6]], { gap: 0.08, vol: 0.045, dur: 1.2 });
      toast('Kéo nút này là nới hay siết vòng cho vừa tay em 💫', 3000);
      return;
    }
    if (selK >= 0) closeCard();
  }

  // ── THE KY NIEM ────────────────────────────────────────────────────────────
  const card = $('card'), seen = new Set();
  let allSeenToast = false;
  function openCard(k) {
    const c = MEMORIES[k];
    selK = k;
    target = rot + wrapPi(TH_C - memTh[k] - rot);          // doan da cua ky niem nay quay ra giua phia truoc
    chime([SCALE[k % SCALE.length], SCALE[(k + 2) % SCALE.length] * 2], { gap: 0.07, vol: 0.05, dur: 1.4 });
    vibrate(10);
    $('cDt').textContent = c.date; $('cTt').textContent = c.title; $('cTx').textContent = c.text;
    $('cN').textContent = `${k + 1}/${M} · tiếp ›`;
    const ph = $('cPh');
    ph.innerHTML = '';
    if (c.photo) {
      const img = new Image(); img.alt = ''; img.decoding = 'async';
      img.onerror = () => { ph.textContent = c.ic; };
      img.src = `images/love/thumbs/${c.photo}.webp`;
      ph.appendChild(img);
    } else ph.textContent = c.ic;
    card.classList.add('show'); stage.classList.add('card-on');
    const tip = $('tip'); if (tip.classList.contains('first')) { tip.classList.remove('first'); tip.textContent = 'Mỗi viên đá giữ một kỷ niệm · chạm để xem · kéo để xoay'; }
    seen.add(k);
    $('seenN').textContent = seen.size;
    if (seen.size === M && !allSeenToast) {
      allSeenToast = true;
      setTimeout(() => toast(`Đủ ${M} kỷ niệm rồi — anh còn một lời nhắn nữa 💌`, 3400), 900);
      $('letterBtn').classList.add('pulse');
    }
    const nx = MEMORIES[(k + 1) % M]; if (nx.photo) { const pre = new Image(); pre.src = `images/love/thumbs/${nx.photo}.webp`; }   // tai truoc anh ky niem ke tiep
  }
  function closeCard() {
    selK = -1; target = null; rotV = 0;
    card.classList.remove('show'); stage.classList.remove('card-on');
  }
  $('cX').addEventListener('click', closeCard);
  $('cN').addEventListener('click', () => openCard((selK + 1) % M));

  // ── LA THU ─────────────────────────────────────────────────────────────────
  const letter = $('letter'), paper = $('paper');
  function buildLetter() {
    let d = 0.25;
    const ln = (html, cls = '') => { const s = `<div class="ln ${cls}" style="--d:${d.toFixed(2)}s">${html}</div>`; d += 0.6; return s; };
    paper.innerHTML = '<button class="x" id="ltX" type="button" aria-label="Đóng">×</button><div class="orn">✦ ✦ ✦</div>' +
      (GIFT.photo ? ln(`<div class="pola"><img src="${esc(GIFT.photo)}" alt=""></div>`) : '') +
      ln(esc(LETTER.greet), 'greet') +
      LETTER.lines.map((t) => ln(`<p>${esc(t)}</p>`)).join('') +
      ln(esc(LETTER.sign), 'sign') +
      ln(`<div class="acts"><button class="btn" id="handBtn" type="button">${esc(FINALE.btn)}</button><button class="btn ghost" id="ltBack" type="button">Ngắm vòng thêm chút</button></div>`);
    $('ltX').addEventListener('click', closeLetter);
    $('ltBack').addEventListener('click', closeLetter);
    $('handBtn').addEventListener('click', () => { closeLetter(); setTimeout(openFinale, 350); });
  }
  function openLetter() {
    if (!paper.firstChild) buildLetter();
    closeCard();
    paper.scrollTop = 0;
    letter.classList.add('show');
    $('letterBtn').classList.remove('pulse');
    chime([SCALE[3], SCALE[5]], { gap: 0.12, vol: 0.04, dur: 1.6 });
  }
  function closeLetter() { letter.classList.remove('show'); }
  $('letterBtn').addEventListener('click', openLetter);
  letter.addEventListener('click', (e) => { if (e.target === letter) closeLetter(); });

  // ── KHOANH KHAC DEO VONG ───────────────────────────────────────────────────
  const fin = $('finale'), fLine = $('fLine'), fSmall = $('fSmall'), beat = $('beat');
  let finT = [];
  const later = (fn, ms) => finT.push(setTimeout(fn, ms));
  function setLine(txt) {
    fLine.classList.add('out');
    later(() => { fLine.textContent = txt; fLine.classList.remove('out'); }, 450);
  }
  function showBtn(id, txt) { const b = $(id); if (txt) b.textContent = txt; b.hidden = false; b.classList.remove('in'); void b.offsetWidth; b.classList.add('in'); }
  function openFinale() {
    finT.forEach(clearTimeout); finT = [];
    ['finDone', 'finAgain', 'finHome'].forEach((id) => { $(id).hidden = true; });
    fLine.textContent = ''; fSmall.textContent = ''; beat.textContent = '🤍';
    fin.classList.add('show');
    paused = true;                                    // vong bi che kin: ngung ve
    keepAwake();
    later(() => setLine(FINALE.close), 500);
    later(() => setLine(FINALE.hand), 3300);
    later(() => showBtn('finDone', FINALE.done), 6000);
  }
  $('finDone').addEventListener('click', () => {
    $('finDone').hidden = true;
    vibrate([20, 60, 20, 60, 40]);
    chime([SCALE[0], SCALE[2], SCALE[3], SCALE[5], SCALE[7], SCALE[8], SCALE[9]], { gap: 0.11, vol: 0.055, dur: 2.6 });
    setLine(FINALE.open);
    later(() => {
      beat.textContent = '💗';
      const r = fin.getBoundingClientRect();
      burst($('fburst'), 60, r.width / 2, r.height * 0.36, 80, Math.min(320, r.width * 0.75), [12, 26]);
      setLine(FINALE.big);
      later(() => { fSmall.textContent = FINALE.small; }, 700);
      later(() => { showBtn('finAgain'); showBtn('finHome'); }, 1600);
    }, 1900);
  });
  $('finAgain').addEventListener('click', () => {
    finT.forEach(clearTimeout); finT = [];
    fin.classList.remove('show'); paused = false;
    rotV = 0; target = null;
  });

  // ── KHOI DONG ──────────────────────────────────────────────────────────────
  layout();
  let rsT = 0;
  addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(layout, 150); });

  // Kiem thu tu dong (khong anh huong nguoi xem): toa do cac hat tren man hinh
  window.vtDebug = {
    stones: () => { const r = bv.getBoundingClientRect(); return stones.map((st) => ({ j: st.j, k: st.mem, x: r.left + st.x, y: r.top + st.y, front: st.sa })); },
    slider: () => { const r = bv.getBoundingClientRect(); return { x: r.left + slider.x, y: r.top + slider.y, front: slider.sa }; },
    state: () => ({ revealed: stage.classList.contains('revealed'), settled: stage.classList.contains('settled'), sel: selK, seen: seen.size, rot, paused, locked: !!locked() }),
  };
})();
</script>
</body>
</html>
